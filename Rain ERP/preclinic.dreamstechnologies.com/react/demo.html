<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabric Procurement — Prototype</title>
<style>
  :root{
    --paper: #F4EFE9;
    --paper-deep: #ECE4DA;
    --card: #FFFFFF;
    --ink: #263A54;
    --ink-soft: #5B6B84;
    --line: #DED3C6;
    --gold: #8E6A2F;
    --gold-soft: #F4E9D4;
    --green: #3B6B45;
    --green-soft: #E4F0E6;
    --red: #A8433C;
    --red-soft: #F6E5E3;
    --navy-soft: #E5EBF2;
    --blue: #2E5A8E;
    --blue-soft: #E5EDF7;
    --shadow: 0 1px 2px rgba(38,58,84,0.06);
    --shadow-hover: 0 6px 18px rgba(38,58,84,0.12);
  }
    /* Requirement 45: Remove spin up/down buttons on all number fields */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none !important;
    margin: 0 !important;
  }
  input[type="number"] {
    -moz-appearance: textfield !important;
    appearance: textfield !important;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:14.5px;
    line-height:1.5;
  }
  h1,h2,h3,.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:236px; flex-shrink:0;
    background:linear-gradient(180deg,#243349 0%, #1B2739 100%);
    color:#EDEFF3;
    padding:26px 0 20px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
    overflow-y:auto;
  }
  .sidebar::-webkit-scrollbar{width:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:3px;}
  .brand{padding:0 22px 20px; border-bottom:1px solid rgba(255,255,255,0.12); margin-bottom:14px; display:flex; align-items:center; gap:10px;}
  .brand .logo{width:34px; height:34px; border-radius:8px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-family:Georgia,serif; font-weight:700; color:#fff; font-size:16px; flex-shrink:0;}
  .brand .title{font-family:Georgia,serif; font-size:16.5px; letter-spacing:0.2px; line-height:1.25;}
  .brand .sub{font-size:11px; color:#AEB8CB; margin-top:1px;}
  .nav{list-style:none; margin:0; padding:0; flex:1;}
  .nav li{margin:0;}
  .nav button{
    width:100%; text-align:left; background:none; border:none; color:#CBD3E1;
    padding:11px 22px; font-size:13.8px; cursor:pointer; display:flex; align-items:center; gap:11px;
    border-left:3px solid transparent; transition:background .12s, color .12s;
  }
  .nav button .num{
    width:21px; height:21px; border-radius:50%; border:1px solid #5B6982; color:#AEB8CB;
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .12s;
  }
  .nav button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav button.active{background:rgba(255,255,255,0.09); color:#fff; border-left-color:var(--gold);}
  .nav button.active .num{background:var(--gold); border-color:var(--gold); color:#fff;}
  .nav-section{padding:16px 22px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; color:#7C889E; font-weight:700;}
  .sidebar-foot{padding:14px 22px 0; font-size:10.8px; color:#8892A6; border-top:1px solid rgba(255,255,255,0.12); margin-top:14px;}
  .user-switcher{padding:12px 22px; border-top:1px solid rgba(255,255,255,0.12); margin-top:auto;}
  .user-switcher label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#8892A6; margin-bottom:5px;}
  .user-switcher select{width:100%; padding:6px 8px; font-size:12.5px; border-radius:5px; border:1px solid #45516A; background:#1B2739; color:#EDEFF3;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:34px 40px 60px; max-width:1180px;}
  .pagehead{margin-bottom:22px;}
  .pagehead h1{font-size:23px; margin:0 0 4px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .pagehead p{margin:0; color:var(--ink-soft); font-size:13.5px; max-width:680px;}
  .crumb{font-size:11.5px; color:var(--gold); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .crumb .back{cursor:pointer; text-decoration:underline; color:var(--ink-soft); text-transform:none; letter-spacing:0;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .card h3{font-size:14.5px; margin:0 0 14px; padding-bottom:10px; border-bottom:1px solid var(--line); font-weight:600; letter-spacing:0.01em; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}

  .kpi-grid{display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap;}
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px 20px; flex:1; min-width:160px;
    box-shadow:var(--shadow); cursor:pointer; transition:box-shadow .15s, transform .15s;
  }
  .kpi:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .kpi .n{font-size:27px; font-weight:600; font-family:Georgia,serif;}
  .kpi .l{font-size:12px; color:var(--ink-soft); margin-top:2px;}

  .chart-row{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:6px;}
  .chart-card{flex:1; min-width:300px;}

  .row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
  .field{flex:1; min-width:170px;}
  .field.small{flex:0 0 120px; min-width:100px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px;}
  .field label .req{color:var(--red);}
  .field .hint{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:5px;
    font-size:13.5px; background:#FCFAF7; color:var(--ink); font-family:inherit;
  }
  textarea{resize:vertical; min-height:56px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(142,106,47,0.12);}
  .inline-add{display:flex; gap:8px;}
  .inline-add select{flex:1;}
  /* Remove number input spinners everywhere — plain, simple fields */
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  input[type=number]{-moz-appearance:textfield; appearance:textfield;}

  /* Tag / pill input (fabric widths, etc.) */
  .tag-input-box{display:flex; flex-wrap:wrap; gap:6px; padding:7px 8px; border:1px solid var(--line); border-radius:5px; background:#FCFAF7;}
  .tag-input-box:focus-within{border-color:var(--gold); background:#fff; box-shadow:0 0 0 3px rgba(142,106,47,0.12);}
  .tag-pill{display:inline-flex; align-items:center; gap:6px; background:var(--gold-soft); color:var(--gold); border-radius:20px; padding:4px 6px 4px 12px; font-size:12.5px; font-weight:600;}
  .tag-pill button{background:rgba(142,106,47,0.18); border:none; color:var(--gold); width:16px; height:16px; border-radius:50%; font-size:11px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .tag-input-box input{border:none; background:none; flex:1; min-width:80px; padding:4px 2px; font-size:13.5px;}
  .tag-input-box input:focus{outline:none; box-shadow:none;}

  /* Audit log / history timeline */
  .audit-log{list-style:none; margin:0; padding:0;}
  .audit-log li{padding:9px 0 9px 18px; border-left:2px solid var(--line); position:relative; font-size:12.5px; color:var(--ink-soft);}
  .audit-log li::before{content:''; position:absolute; left:-5px; top:13px; width:8px; height:8px; border-radius:50%; background:var(--gold);}
  .audit-log li b{color:var(--ink); font-weight:600;}
  .audit-log li .ts{color:var(--ink-soft); font-size:11px;}
  .expected-tag{display:inline-block; font-size:11.5px; color:var(--blue); background:var(--blue-soft); padding:1px 8px; border-radius:10px; margin-left:6px; font-weight:600;}
  .piece-list{display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; padding-right:4px;}
  .piece-row{border:1px solid var(--line); border-radius:6px; padding:10px 12px; background:#fff;}
  .piece-row-head{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;}
  .piece-row-head input[type=checkbox]{width:auto;}

  /* Article tiles (order creation) */
  .article-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; margin-bottom:6px;}
  .article-tile{
    position:relative; border:1.5px solid var(--line); border-radius:8px; padding:16px 10px; text-align:center;
    font-size:13px; font-weight:600; cursor:pointer; background:#fff; transition:all .12s;
  }
  .article-tile:hover{border-color:var(--gold);}
  .article-tile.selected{border-color:var(--gold); background:var(--gold-soft); color:var(--gold);}
  .article-tile.others, .article-tile.add-new{color:var(--ink-soft); font-weight:500; display:flex; align-items:center; justify-content:center;}
  .article-tile.add-new{border-style:dashed;}
  .article-tile .tile-check{position:absolute; top:6px; right:8px; color:var(--gold); font-weight:700;}

  /* Chips (article/color quick-select) */
  .chip-row{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:500;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--ink);
  }
  .chip-on{border-color:var(--gold); background:var(--gold-soft); color:var(--gold); font-weight:700;}

  /* Sales order — customer/size UI polish */
  .customer-card{border:1.5px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:14px; background:#fff;}
  .section-divider{height:1px; background:var(--line); margin:14px 0;}
  .size-block{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; background:#FCFAF7;}
  .size-block-head{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:10px;}
  .size-series-panel{border:1px dashed var(--line); border-radius:6px; padding:12px 14px; margin-top:8px; background:#fff;}
  .uniform-prompt{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--gold-soft); border-radius:6px; padding:10px 14px; font-size:13px; color:var(--gold); margin-bottom:8px;}
  .stock-status-banner{padding:10px 16px; border-radius:6px; font-size:13.5px; font-weight:600;}
  .stock-status-banner.in-stock{background:var(--green-soft); color:var(--green);}
  .stock-status-banner.not-in-stock{background:var(--navy-soft); color:var(--ink-soft);}
  .order-fabric-choice{display:flex; gap:14px; align-items:flex-start; border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color .12s, background .12s;}
  .order-fabric-choice:hover{border-color:var(--gold); background:var(--gold-soft);}
  .order-fabric-choice.recommended{border-color:var(--green); background:var(--green-soft);}
  .readiness-row{padding:12px 0; border-bottom:1px solid #EFE9E1;}
  .readiness-row:last-child{border-bottom:none;}
  .readiness-row-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; font-size:13.5px;}
  .readiness-bar-track{background:#EFE9E1; border-radius:5px; height:10px; overflow:hidden;}
  .readiness-bar-fill{height:100%; background:var(--green); border-radius:5px; transition:width .4s;}
  .checklist-row{padding:8px 0; border-bottom:1px solid #EFE9E1; font-size:13.5px;}
  .checklist-row:last-child{border-bottom:none;}
  .checklist-row label{display:flex; align-items:flex-start; gap:8px; cursor:pointer;}
  .checklist-row input[type=checkbox]{width:auto; margin-top:3px; flex-shrink:0;}
  .disabled-card{opacity:0.7;}

  /* Emoji picker (Article master) */
  .emoji-grid{display:grid; grid-template-columns:repeat(9,1fr); gap:6px; max-width:400px;}
  .emoji-choice{font-size:20px; padding:6px 0; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; transition:border-color .12s;}
  .emoji-choice:hover{border-color:var(--gold); background:var(--gold-soft);}

  /* Color picker swatches (Color master) */
  .swatch-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:8px; max-width:340px;}
  .swatch{width:100%; aspect-ratio:1; border-radius:6px; border:1.5px solid var(--line); cursor:pointer; padding:0;}
  .swatch:hover{border-color:var(--ink);}

  /* Color cards grid */
  .color-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:14px;}
  .color-card{border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; background:#fff; transition:box-shadow .12s, transform .12s;}
  .color-card:hover{box-shadow:var(--shadow-hover); transform:translateY(-2px);}
  .color-swatch-big{height:70px; width:100%;}
  .color-card-name{font-weight:600; font-size:13px; padding:8px 10px 2px;}
  .color-card-hex{font-size:11px; color:var(--ink-soft); padding:0 10px 10px; font-variant-numeric:tabular-nums;}

  button{font-family:inherit; cursor:pointer;}
  .btn{
    padding:8px 16px; border-radius:5px; border:1px solid var(--line); background:#fff;
    color:var(--ink); font-size:13px; font-weight:500; transition:all .12s;
  }
  .btn:hover{border-color:var(--ink-soft); box-shadow:0 2px 6px rgba(0,0,0,0.06);}
  .btn-primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .btn-primary:hover{background:#1c2c42;}
  .btn-gold{background:var(--gold); color:#fff; border-color:var(--gold);}
  .btn-gold:hover{background:#785a27;}
  .btn-green{background:var(--green); color:#fff; border-color:var(--green);}
  .btn-red{background:transparent; color:var(--red); border-color:var(--red);}
  .btn-small{padding:5px 10px; font-size:12px;}
  .btn-link{background:none; border:none; color:var(--gold); font-size:12.5px; padding:0; text-decoration:underline;}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:11.3px; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600;
  }
  td{padding:10px; border-bottom:1px solid #EFE9E1; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  td input, td select{padding:6px 8px; font-size:13px;}
  .amt{font-variant-numeric: tabular-nums;}
  tr.clickable{cursor:pointer; transition:background .1s;}
  tr.clickable:hover{background:#FAF6F0;}
  .chev{color:var(--ink-soft); opacity:.5;}

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.3px; font-weight:600; white-space:nowrap;}
  .pill-draft{background:var(--navy-soft); color:var(--ink);}
  .pill-sent{background:var(--gold-soft); color:var(--gold);}
  .pill-closed{background:var(--green-soft); color:var(--green);}
  .pill-ok{background:var(--green-soft); color:var(--green);}
  .pill-pending{background:#F3E9D2; color:#8A6A20;}
  .pill-reject{background:var(--red-soft); color:var(--red);}
  .pill-progress{background:var(--blue-soft); color:var(--blue);}

  .empty{color:var(--ink-soft); font-size:13px; padding:22px 4px; text-align:center; border:1px dashed var(--line); border-radius:6px;}

  .stars{display:inline-flex; gap:2px; cursor:pointer;}
  .stars span{font-size:17px; color:#D8CFC5;}
  .stars span.on{color:#D9A521;}

  .badge-req{font-size:10.5px; color:var(--ink-soft); border:1px solid var(--line); border-radius:3px; padding:1px 6px; margin-left:6px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,34,44,0.5); display:none;
    align-items:flex-start; justify-content:center; padding:5vh 20px; z-index:50; overflow:auto;
  }
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:480px; padding:24px 26px; box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .modal.wide{max-width:640px;}
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .modal-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
  .modal-close{float:right; background:none; border:none; font-size:19px; color:var(--ink-soft); line-height:1;}

  /* In-page print preview (no popups — works inside sandboxed file previews too) */
  #printPreviewOverlay{
    display:none; position:fixed; inset:0; background:#5a5f6b; z-index:200; overflow-y:auto;
  }
  #printPreviewOverlay.show{display:block;}
  .print-toolbar{
    position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center;
    background:#1c2431; color:#fff; padding:12px 24px; font-family:Arial,sans-serif; font-size:14px;
  }
  .print-toolbar button{padding:8px 16px; border-radius:5px; border:1px solid #fff; background:#fff; color:#1c2431; font-size:13px; cursor:pointer; font-weight:600; margin-left:10px;}
  .print-toolbar button.close{background:transparent; color:#fff;}
  .print-note{max-width:850px; margin:14px auto 0; padding:10px 16px; background:#FFF7E0; border:1px solid #E8D28A; border-radius:6px; font-family:Arial,sans-serif; font-size:12.5px; color:#6B5A1E;}
  @media print{ .print-note{display:none !important;} }
  .print-doc{
    background:#fff; max-width:850px; margin:24px auto 60px; padding:40px 50px; box-shadow:0 8px 30px rgba(0,0,0,0.3);
    font-family:Georgia,'Times New Roman',serif; color:#1c2431; font-size:13.5px; min-height:1000px;
  }
  .print-doc .doc-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #1c2431; padding-bottom:18px; margin-bottom:22px;}
  .print-doc .doc-head .company{font-size:22px; font-weight:700; letter-spacing:0.02em;}
  .print-doc .doc-head .company .tag{font-family:Arial,sans-serif; font-size:11px; color:#666; font-weight:400; margin-top:2px;}
  .print-doc .doc-head .doctitle{text-align:right;}
  .print-doc .doc-head .doctitle h1{margin:0; font-size:26px; letter-spacing:0.06em;}
  .print-doc .doc-head .doctitle .meta{font-family:Arial,sans-serif; font-size:12px; color:#444; margin-top:6px;}
  .print-doc .parties{display:flex; justify-content:space-between; gap:30px; margin-bottom:24px; font-family:Arial,sans-serif;}
  .print-doc .parties .block{flex:1;}
  .print-doc .parties .block h4{margin:0 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#888;}
  .print-doc .parties .block .name{font-weight:700; font-size:14px; margin-bottom:2px;}
  .print-doc table{width:100%; border-collapse:collapse; margin-bottom:22px; font-family:Arial,sans-serif; font-size:12.5px;}
  .print-doc th{background:#1c2431; color:#fff; text-align:left; padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:0.03em;}
  .print-doc td{padding:9px 10px; border-bottom:1px solid #ddd;}
  .print-doc tfoot td{font-weight:700; border-top:2px solid #1c2431; border-bottom:none;}
  .print-doc .terms{font-family:Arial,sans-serif; font-size:12px; color:#444; margin-bottom:30px;}
  .print-doc .sign-row{display:flex; justify-content:space-between; margin-top:60px; font-family:Arial,sans-serif; font-size:12px;}
  .print-doc .sign-row .sign{width:200px; text-align:center;}
  .print-doc .sign-row .sign .line{border-top:1px solid #333; margin-top:50px; padding-top:6px;}
  .print-doc .swatch-note{border:1px dashed #999; padding:10px; font-family:Arial,sans-serif; font-size:11px; color:#666; text-align:center; margin-top:6px;}
  @media print{
    body > *:not(#printPreviewOverlay){ display:none !important; }
    #printPreviewOverlay{ position:static; background:#fff; }
    .print-toolbar{ display:none !important; }
    .print-doc{ box-shadow:none; margin:0; max-width:100%; padding:0.4in; min-height:0; }
  }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 22px; border-radius:6px; font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:100; display:none; align-items:center; gap:10px;
  }
  .toast.show{display:flex;}
  .toast .dot{width:8px; height:8px; border-radius:50%; background:var(--green);}

  .bale-block{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:14px; background:#FCFAF7;}
  .bale-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .bale-head b{font-size:13px;}

/* ---- Auto-capitalize the first letter of every word in main text fields ----
   Applies to any <input type=text> or <textarea> UNLESS it carries data-nocap
   (used for things like GSTIN, IFSC, HSN, LR/challan/invoice numbers, search boxes). */
document.addEventListener('input', function(e){
  const el = e.target;
  const isTextish = (el.tagName==='INPUT' && el.type==='text') || el.tagName==='TEXTAREA';
  if(!isTextish || el.hasAttribute('data-nocap')) return;
  const pos = el.selectionStart, posEnd = el.selectionEnd;
  const before = el.value;
  const after = before.replace(/(^|\s)([a-z])/g, (m,p1,p2)=>p1+p2.toUpperCase());
  if(after !== before){
    el.value = after;
    el.setSelectionRange(pos, posEnd);
  }
}, true);

/* ---- Audit log helpers ----
   Every transactional record keeps an append-only history array. Each entry
   optionally carries field/oldVal/newVal so an edit shows exactly what changed,
   matching the Date/User/Action/Field/Previous/Updated shape asked for.
   Every entry is ALSO mirrored into db.globalActivity for the cross-module
   Activity Dashboard (Section 2 of the client's ask). */
function logEvent(auditArr, action, note, module, recordRef){
  const entry = { ts: nowTS(), tsRaw: Date.now(), actor: currentActorLabel(), action, note: note||'', module, recordRef };
  auditArr.push(entry);
  if(module) db.globalActivity.push(entry);
}
function logChange(auditArr, field, oldVal, newVal, module, recordRef){
  const entry = { ts: nowTS(), tsRaw: Date.now(), actor: currentActorLabel(), action:'Updated', field, oldVal:(oldVal===undefined||oldVal===''?'—':oldVal), newVal:(newVal===undefined||newVal===''?'—':newVal), module, recordRef };
  auditArr.push(entry);
  if(module) db.globalActivity.push(entry);
}
function auditLogHTML(auditArr){
  if(!auditArr || !auditArr.length) return '<div class="empty">No history yet</div>';
  return `<ul class="audit-log">${auditArr.slice().reverse().map(a=>`<li><span class="ts">${a.ts}</span> — <b>${a.action}</b>${a.field?(' — <i>'+a.field+'</i>: '+a.oldVal+' → '+a.newVal):''}${a.note?(' — '+a.note):''} <span style="color:var(--ink-soft);">(${a.actor})</span></li>`).join('')}</ul>`;
}

function tagInputHTML(id, values){
  window['_tags_'+id] = values.slice();
  return `
    <div class="tag-input-box" id="tagbox_${id}">
      ${values.map((v,i)=>`<span class="tag-pill" data-i="${i}">${v}<button type="button" onclick="tagRemove('${id}', ${i})">&times;</button></span>`).join('')}
      <input type="text" data-nocap placeholder="Type a value, press Enter" onkeydown="tagKeydown(event,'${id}')">
    </div>`;
}
window.tagKeydown = function(evt, id){
  if(evt.key === 'Enter'){
    evt.preventDefault();
    const val = evt.target.value.trim();
    if(val){
      window['_tags_'+id].push(val);
      evt.target.value='';
      repaintTagBox(id);
    }
  }
};
window.tagRemove = function(id, idx){
  window['_tags_'+id].splice(idx,1);
  repaintTagBox(id);
};
function repaintTagBox(id){
  const box = document.getElementById('tagbox_'+id);
  if(!box) return;
  const values = window['_tags_'+id];
  box.innerHTML = values.map((v,i)=>`<span class="tag-pill" data-i="${i}">${v}<button type="button" onclick="tagRemove('${id}', ${i})">&times;</button></span>`).join('')
    + `<input type="text" data-nocap placeholder="Type a value, press Enter" onkeydown="tagKeydown(event,'${id}')">`;
  box.querySelector('input').focus();
}

  `;

}
window.closePrintPreview = function(){

window.downloadPrintDoc = function(){
  const { title, bodyHTML } = window._lastPrintDoc;
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title><style>${STANDALONE_PRINT_CSS}</style></head><body>${bodyHTML}</body></html>`;
  try{
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = title.replace(/[^a-z0-9]+/gi,'_') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Downloaded — open the file, then use your browser\'s Print (Ctrl/Cmd+P) to save it as a PDF');
  } catch(e){
    toast('Download did not start — please try Print instead, or open this page directly in your browser');
  }
};

function wireStars(container, onChange){
  const picker = container.querySelector('#starPicker');
  if(!picker) return;
  picker.querySelectorAll('span').forEach(el=>{
    el.addEventListener('click', ()=>{
      const val = Number(el.dataset.v);

/* ---- lightweight charts (no external libraries, fully offline) ---- */
function donutChartHTML(data, opts={}){
  const size = opts.size || 138, hole = opts.hole || 0.6;
  const total = data.reduce((s,d)=>s+d.value,0);
  let acc = 0;
  const stops = total>0 ? data.map(d=>{
    const start = acc/total*100; acc += d.value; const end = acc/total*100;
    return `${d.color} ${start}% ${end}%`;
  }).join(', ') : '#EFE9E1 0% 100%';
  return `
    <div style="display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
      <div style="position:relative; width:${size}px; height:${size}px; border-radius:50%; background:conic-gradient(${stops}); flex-shrink:0;">
        <div style="position:absolute; inset:${Math.round(size*(1-hole)/2)}px; background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column;">
          <div style="font-size:19px; font-weight:700; font-family:Georgia,serif;">${total}</div>
          <div style="font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;">total</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; min-width:130px;">
        ${data.map(d=>`<div class="legend-row"><span class="legend-dot" style="background:${d.color};"></span>${d.label} <b style="margin-left:auto; padding-left:16px;">${d.value}</b></div>`).join('')}
      </div>
    </div>`;
}
function barListHTML(data){
  const max = Math.max(...data.map(d=>d.value), 1);
  return `<div style="display:flex; flex-direction:column; gap:13px;">
    ${data.map(d=>`
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;">
          <span>${d.label}</span><b>${d.value}${d.unit||''}</b>
        </div>
        <div style="background:#EFE9E1; border-radius:5px; height:10px; overflow:hidden;">
          <div style="width:${(d.value/max*100).toFixed(1)}%; height:100%; background:${d.color}; border-radius:5px; transition:width .4s;"></div>
        </div>
      </div>`).join('') || '<div class="empty">No data yet</div>'}
  </div>`;
}

/* ---- derived / computed helpers ---- */
function receivedForItem(poId, itemIdx){
  let sum = 0;
  db.grns.filter(g=>g.poId===poId && (g.sourceType||'po')==='po').forEach(g=>{
    g.bales.forEach(b=>{ if(b.itemIdx===itemIdx) sum += b.pieces.reduce((s,m)=>s+Number(m||0),0); });
  });
  return sum;
}
function grnStatus(grn){
  if(!grn.submitted) return 'Draft';
  const recs = db.qcRecords.filter(q=>q.grnId===grn.id);
  if(recs.length===0) return 'Awaiting QC';
  if(recs.every(r=>r.status==='OK'||r.status==='Approved'||r.status==='Rejected by Admin')) return 'Completed';
  return 'In Progress';
}
function fabricName(id){ const f=db.fabrics.find(x=>x.id===id); return f?f.quality:'—'; }

/* ---- Unified Stock Pool helpers ----
   Every stock entry carries fabricId/width/colorId directly (colorId may be
   null for un-dyed greige), so quantity can always be tracked and deducted
   per exact colour/width combination, never lumped together. */
function pushStock(fabricId, width, colorId, qty, source, decidedAt, meta){
  if(qty<=0) return null;
  const entry = { id: nextId(), fabricId, width, colorId: colorId||null, qty, source, decidedAt, ...(meta||{}) };
  db.stockPool.push(entry);
  return entry;
}
function stockAvailableFor(fabricId, width, colorId){
  return db.stockPool.filter(s=>s.fabricId===fabricId && s.width===width && (s.colorId||null)===(colorId||null)).reduce((sum,s)=>sum+s.qty,0);
}
function deductStock(fabricId, width, colorId, qtyNeeded, note){
  let remaining = qtyNeeded;
  const matches = db.stockPool.filter(s=>s.fabricId===fabricId && s.width===width && (s.colorId||null)===(colorId||null) && s.qty>0);
  for(const s of matches){
    if(remaining<=0.0001) break;
    const take = Math.min(s.qty, remaining);
    s.qty = Math.round((s.qty - take)*1000)/1000;
    remaining -= take;
  }
  db.stockPool = db.stockPool.filter(s=>s.qty>0.001);
  return Math.round((qtyNeeded - remaining)*1000)/1000; // actually deducted
}
function vendorName(id){ const v=db.vendors.find(x=>x.id===id); return v?v.name:'—'; }

  const data = {
    name,
    type: document.getElementById('v_type').value,
    contact: document.getElementById('v_contact').value,
    phone: document.getElementById('v_phone').value,
    altPhone: document.getElementById('v_altphone').value,

    state: document.getElementById('v_state').value,
    rating: window._pendingRating ? window._pendingRating() : 0,
    bank: document.getElementById('v_bank').value,
    account: document.getElementById('v_account').value,
    ifsc: document.getElementById('v_ifsc').value,
    active: document.getElementById('v_active').value==='1',
  };
  let v;
  if(editId){

    Object.assign(v, data);
  } else {
    v = { id: nextId(), ...data };

};

let poDraft = null;
let editingPoId = null;
function freshPODraft(){
  return { vendorId: db.vendors[0]?.id||null, linkedOrderId:'', date: todayISO(), expected:'', terms:'', items: [], notes:'', auditLog:[] };
}
function renderPOForm(poId){
  if(poId){
    const po = db.pos.find(p=>p.id===poId);
    editingPoId = poId;
    poDraft = JSON.parse(JSON.stringify({ vendorId:po.vendorId, linkedOrderId:po.linkedOrderId, date:po.date, expected:po.expected, terms:po.terms, items:po.items, notes:po.notes, auditLog:po.auditLog||[] }));
  } else {
    editingPoId = null;
    poDraft = freshPODraft();

      Object.assign(poDraft, window._prefillPOFromOrder);
      window._prefillPOFromOrder = null;

function poVendorOptions(){
  return db.vendors.map(v=>`<option value="${v.id}" ${poDraft.vendorId===v.id?'selected':''}>${v.name}</option>`).join('');
}
function poOrderOptions(){
  return '<option value="">— none —</option>' + db.orders.map(o=>`<option value="${o.id}" ${poDraft.linkedOrderId==o.id?'selected':''}>${o.name}</option>`).join('');
}
function fabricOptionsFor(item){
  return db.fabrics.map(f=>`<option value="${f.id}" ${item.fabricId===f.id?'selected':''}>${f.quality}</option>`).join('');
}
function widthOptionsFor(item){
  const f = db.fabrics.find(x=>x.id===item.fabricId);
  if(!f) return '<option value="">—</option>';
  return f.widths.map(w=>`<option value="${w}" ${item.width===w?'selected':''}>${w}</option>`).join('');
}

        </div>

        <div class="field"><label>Discount / terms</label><input type="text" placeholder="Notes on discount, payment terms…" value="${poDraft.terms}" onchange="poDraft.terms=this.value"></div>

window.paintPOForm = paintPOForm;
window.poAddItem = function(){
  const f = db.fabrics[0];
  poDraft.items.push({ fabricId: f?f.id:null, width: f?f.widths[0]:'', colorId: null, qty:'', rate:'', fold: f?f.shrinkage:'', amount:0 });
  paintPOForm();
};
window.poRemoveItem = function(idx){ poDraft.items.splice(idx,1); paintPOForm(); };
window.poItemFabricChange = function(idx, fabricId, newFabric){
  const f = newFabric || db.fabrics.find(x=>x.id===Number(fabricId));
  if(!f) return;
  poDraft.items[idx].fabricId = f.id;
  poDraft.items[idx].width = f.widths[0];
  poDraft.items[idx].fold = f.shrinkage;
  paintPOForm();
};
window.poItemField = function(idx, field, value){
  const it = poDraft.items[idx];
  it[field] = value;
  it.amount = Number(it.qty||0) * Number(it.rate||0);
  paintPOForm();
};

window.poSave = function(status){
  if(!poDraft.vendorId){ toast('Please select a vendor'); return; }
  if(poDraft.items.length===0){ toast('Add at least one fabric line item'); return; }
  if(editingPoId){
    const po = db.pos.find(p=>p.id===editingPoId);
    if(po.status !== status) logChange(poDraft.auditLog, 'Status', po.status, status, 'Purchase Order', 'PO-'+editingPoId);
    else logEvent(poDraft.auditLog, 'Updated', '', 'Purchase Order', 'PO-'+editingPoId);
    Object.assign(po, poDraft, {status});
    toast('PO-'+editingPoId+' updated — status "'+status+'"');
  } else {
    const po = { id: nextId(), ...poDraft, status };
    logEvent(po.auditLog, 'Created', 'Status: '+status, 'Purchase Order', 'PO-'+po.id);
    db.pos.push(po);
    toast('Purchase order PO-'+po.id+' saved as "'+status+'"');
  }
  go('po-list');
};

      <thead><tr><th>Document</th><th>Vendor</th><th>Fabric(s)</th><th></th></tr></thead>
      <tbody>${poRows}${challanRows}${(!poRows && !challanRows) ? '<tr><td colspan="4" class="empty">Nothing ready to receive — send a Purchase Order or dispatch a Job Challan first.</td></tr>' : ''}</tbody>
    </table>
  `, true);
};

/* ---------------------------------------------------------------
   GRN — NEW (with bale-wise entry)
--------------------------------------------------------------- */
let grnDraft = null;
let editingGrnId = null;
/* ---- Unified GRN source resolution ----
   A GRN can be raised against either a fabric Purchase Order (Route 2) or a
   Job Challan (fabric coming back from processing/dyeing) — both flow through
   the exact same GRN and Quality Check screens, fields, and rules. */
function resolveGrnSource(g){
  const sourceType = g.sourceType || 'po';
  if(sourceType==='challan'){
    const challan = db.jobChallans.find(c=>c.id===g.poId);
    if(!challan) return null;
    return {
      kind:'challan', vendorId: challan.vendorId, ref: 'Challan-'+challan.challanNo, refLink: `go('job-challan-detail', ${challan.id})`,
      items: challan.lines.map(l=>({ fabricId:l.fabricId, width:l.width, colorId:l.colorId, qty:l.meters,
        label: `${fabricName(l.fabricId)} (${l.width})${l.colorId?(' — '+colorName(l.colorId)):''} — PO-${l.poNo}` })),
    };
  }
  const po = db.pos.find(p=>p.id===g.poId);
  if(!po) return null;
  return {
    kind:'po', vendorId: po.vendorId, ref: 'PO-'+po.id, refLink: `go('po-form', ${po.id})`,
    items: po.items.map(it=>({ fabricId:it.fabricId, width:it.width, colorId:it.colorId, qty:it.qty, fold:it.fold,
      label: `${fabricName(it.fabricId)} (${it.width})${it.colorId?(' — '+colorName(it.colorId)):' — Greige'}` })),
  };
}
function renderGRNNew(arg){
  const existing = typeof arg === 'number' ? db.grns.find(g=>g.id===arg) : null;
  if(existing){
    editingGrnId = existing.id;
    grnDraft = JSON.parse(JSON.stringify(existing));
    paintGRNForm();
    return;
  }
  editingGrnId = null;
  let sourceType = 'po', sourceId = arg, src;
  if(typeof arg === 'string' && arg.indexOf(':')>-1){
    const parts = arg.split(':'); sourceType = parts[0]; sourceId = Number(parts[1]);
  }
  if(sourceType==='challan'){
    const challan = db.jobChallans.find(c=>c.id===sourceId);
    if(!challan){ toast('Open this from a Job Challan'); go('job-challan-list'); return; }
    src = challan;
  } else {
    src = db.pos.find(p=>p.id===sourceId) || db.pos.find(p=>p.status!=='Draft');
    if(!src){ toast('Create a Purchase Order first'); go('po-list'); return; }
    sourceId = src.id; sourceType = 'po';
  }
  grnDraft = {
    sourceType, poId: sourceId, challan:'', invoice:'', receivedDate: todayISO(),
    transporterId: db.transporters[0]?.id||'', lrNo:'', lrDate:'', weight:'', foldingCms:'', invoiceValue:'',
    totalQty:'', numBales:'', bales:[], challanDate:'', invoiceDate:'', submitted:false, headerLocked:false, auditLog:[],
  };
  logEvent(grnDraft.auditLog, 'GRN started', 'Against '+(sourceType==='challan'?('Challan-'+src.challanNo):('PO-'+src.id)));
  paintGRNForm();
}
function grnPOOptions(){
  const eligiblePOs = db.pos.filter(po=>po.status!=='Draft').map(po=>`<option value="po:${po.id}" ${(!grnDraft.sourceType||grnDraft.sourceType==='po')&&grnDraft.poId===po.id?'selected':''}>PO-${po.id} — ${vendorName(po.vendorId)} (fabric purchase)</option>`);
  const eligibleChallans = db.jobChallans.filter(c=>c.status==='Sent').map(c=>`<option value="challan:${c.id}" ${grnDraft.sourceType==='challan'&&grnDraft.poId===c.id?'selected':''}>Challan-${c.challanNo} — ${vendorName(c.vendorId)} (processing return)</option>`);
  return [...eligiblePOs, ...eligibleChallans].join('');
}
function poItemLabel(po, itemIdx){
  const it = po.items[itemIdx];
  return `${fabricName(it.fabricId)} (${it.width})${it.colorId?(' — '+colorName(it.colorId)):' — Greige'}`;
}
function isBaleLocked(bale){
  if(!editingGrnId || !grnDraft.submitted) return false;
  const q = db.qcRecords.find(x=>x.grnId===editingGrnId && x.itemIdx===bale.itemIdx);
  return !!(q && q.status !== 'Pending');
}
function paintGRNForm(){
  const src = resolveGrnSource(grnDraft);
  const poItemOptions = (bale) => src.items.map((it,i)=>`<option value="${i}" ${bale.itemIdx===i?'selected':''}>${it.label}</option>`).join('');

  const balesHTML = grnDraft.bales.map((b,bi)=>{
    const locked = isBaleLocked(b);
    const baleTotal = b.pieces.reduce((s,m)=>s+Number(m||0),0);
    const piecesHTML = b.pieces.map((m,pi)=>`
      <div class="piece"><span>Pc ${pi+1}</span><input type="number" id="piece_${bi}_${pi}" value="${m}" ${locked?'disabled':''} onchange="grnPieceMeter(${bi},${pi},this.value)" onkeydown="grnPieceKeydown(event,${bi},${pi})"></div>
    `).join('');
    return `
      <div class="bale-block ${locked?'bale-locked':''}">
        <div class="bale-head">
          <b>Bale ${b.baleNo || (bi+1)}</b>
          ${locked ? '<span class="pill pill-closed">🔒 QC actioned — locked</span>' : `<button class="btn-link" onclick="grnRemoveBale(${bi})">Remove</button>`}
        </div>
        <div class="row" style="margin-bottom:6px;">
          <div class="field small"><label>Bale no.</label><input type="text" ${locked?'disabled':''} value="${b.baleNo}" onchange="grnBaleField(${bi},'baleNo',this.value)"></div>
          <div class="field"><label>PO fabric item</label><select ${locked?'disabled':''} onchange="grnBaleField(${bi},'itemIdx',Number(this.value))">${poItemOptions(b)}</select></div>
          <div class="field small"><label>No. of pieces</label><input type="number" min="0" ${locked?'disabled':''} value="${b._pieceCountRaw!==undefined ? b._pieceCountRaw : (b.pieces.length||'')}" onchange="grnSetPieceCount(${bi},this.value)"></div>
        </div>
        ${b.pieces.length ? `<div class="pieces-grid">${piecesHTML}</div>` : '<div class="empty" style="padding:10px;">Set number of pieces to generate meter fields</div>'}
        <div class="bale-total-row">
          <span class="hint">${b.pieces.length} piece(s) — assigned to <b>${src.items[b.itemIdx]?.label||'—'}</b></span>
          <span class="bale-total-badge">${baleTotal}<small>m</small></span>
        </div>
      </div>`;
  }).join('');

  const grandTotal = grnDraft.bales.reduce((s,b)=>s+b.pieces.reduce((x,m)=>x+Number(m||0),0),0);
  const declared = Number(grnDraft.totalQty||0);
  const matches = declared>0 && Math.abs(grandTotal-declared)<0.01;
  const hasEntries = grnDraft.bales.some(b=>b.pieces.length>0);

  // per-item breakdown preview (what QC records will be created)
  const perItem = {};
  grnDraft.bales.forEach(b=>{
    if(!b.pieces.length) return;
    perItem[b.itemIdx] = (perItem[b.itemIdx]||0) + b.pieces.reduce((s,m)=>s+Number(m||0),0);
  });
  const perItemRows = Object.entries(perItem).map(([idx,qty])=>`<li>${src.items[Number(idx)]?.label||'—'} — <b>${qty}m</b> → will create its own Quality Check</li>`).join('');

  const headerLocked = !!grnDraft.headerLocked;
  const headerFieldsHTML = headerLocked ? `
      <div class="detail-grid">
        <div><div class="dt">Source document</div><div class="dd">${src.ref}</div></div>
        <div><div class="dt">Received date</div><div class="dd">${grnDraft.receivedDate}</div></div>
        <div><div class="dt">Vendor challan</div><div class="dd">${grnDraft.challan||'—'} ${grnDraft.challanDate?('· '+grnDraft.challanDate):''}</div></div>
        <div><div class="dt">Vendor invoice</div><div class="dd">${grnDraft.invoice||'—'} ${grnDraft.invoiceDate?('· '+grnDraft.invoiceDate):''} ${grnDraft.invoiceValue?(' · ₹'+grnDraft.invoiceValue):''}</div></div>
        <div><div class="dt">Transporter</div><div class="dd">${db.transporters.find(t=>t.id===grnDraft.transporterId)?.name||'—'}</div></div>
        <div><div class="dt">LR no. / date</div><div class="dd">${grnDraft.lrNo||'—'} ${grnDraft.lrDate?('/ '+grnDraft.lrDate):''}</div></div>
        <div><div class="dt">Weight</div><div class="dd">${grnDraft.weight||'—'} kg</div></div>
        <div><div class="dt">Fabric folding</div><div class="dd">${grnDraft.foldingCms?grnDraft.foldingCms+' cms':'—'}</div></div>
        <div><div class="dt">Total qty / bales</div><div class="dd">${grnDraft.totalQty||0}m / ${grnDraft.numBales||0}</div></div>
      </div>
  ` : `
      <div class="row">
        <div class="field"><label>Source document</label><select onchange="grnChangeSource(this.value)">${grnPOOptions()}</select></div>
        <div class="field"><label>Received date <span class="req">*</span></label><input type="date" value="${grnDraft.receivedDate}" onchange="grnDraft.receivedDate=this.value"></div>
      </div>
      <div class="row">
        <div class="field"><label>Vendor challan no. (optional)</label><input type="text" data-nocap value="${grnDraft.challan}" onchange="grnDraft.challan=this.value"></div>
        <div class="field small"><label>Vendor challan date (optional)</label><input type="date" value="${grnDraft.challanDate||''}" onchange="grnDraft.challanDate=this.value"></div>
        <div class="field"><label>Vendor invoice no. (optional)</label><input type="text" data-nocap value="${grnDraft.invoice}" onchange="grnDraft.invoice=this.value"></div>
        <div class="field small"><label>Vendor invoice date (optional)</label><input type="date" value="${grnDraft.invoiceDate||''}" onchange="grnDraft.invoiceDate=this.value"></div>
        <div class="field small"><label>Invoice value (₹)</label><input type="number" value="${grnDraft.invoiceValue}" onchange="grnDraft.invoiceValue=this.value"></div>
      </div>
      <div class="row">
        <div class="field">
          <label>Transporter</label>
          <div class="inline-add">
            <select onchange="grnDraft.transporterId=Number(this.value)">${db.transporters.map(t=>`<option value="${t.id}" ${grnDraft.transporterId===t.id?'selected':''}>${t.name}</option>`).join('')}</select>
            <button class="btn btn-small" onclick="openTransporterModal((t)=>{grnDraft.transporterId=t.id; paintGRNForm();})">+ New</button>
          </div>
        </div>
        <div class="field small"><label>LR no.</label><input type="text" data-nocap value="${grnDraft.lrNo}" onchange="grnDraft.lrNo=this.value"></div>
        <div class="field small"><label>LR date</label><input type="date" value="${grnDraft.lrDate}" onchange="grnDraft.lrDate=this.value"></div>
        <div class="field small"><label>Fabric folding (cms)</label><input type="number" value="${grnDraft.foldingCms}" onchange="grnDraft.foldingCms=this.value"></div>
      </div>
      <div class="row" style="align-items:flex-end;">
        <div class="field small"><label>Weight (kg)</label><input type="number" value="${grnDraft.weight}" onchange="grnDraft.weight=this.value"></div>
        <div class="field small"><label>Total qty (m) <span class="req">*</span></label><input type="number" value="${grnDraft.totalQty}" onchange="grnDraft.totalQty=this.value; paintGRNForm();"></div>
        <div class="field small">
          <label>No. of bales <span class="req">*</span></label>
          <input type="number" min="0" value="${grnDraft.numBales}" onchange="grnDraft.numBales=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault(); grnDraft.numBales=this.value; grnGenerateBales();}">
        </div>
        <div class="field small" style="display:flex; gap:8px;">
          <button class="btn btn-gold" onclick="grnGenerateBales()">Generate Bales</button>
          <button class="btn btn-small" onclick="grnLockHeaderSection()">💾 Save This Section</button>
        </div>
      </div>
      <div class="hint">Press Enter in "No. of bales" to generate immediately, or use the buttons above.</div>
  `;

  main.innerHTML = `
    <div class="pagehead">
      <div class="crumb"><span class="back" onclick="go('grn-list')">← back to GRN Register</span></div>
      <h1>${editingGrnId ? 'Goods Received Note — GRN-'+editingGrnId+(grnDraft.submitted?'':' (draft)') : 'Goods Received Note'}</h1>
      <p>Recording receipt against <b>${src.ref}</b> (${vendorName(src.vendorId)}). Full or partial quantity is allowed. If bales below are split across more than one fabric/width/colour, each gets its own quality check. Bales stay editable until their item's Quality Check has been actioned.</p>
    </div>

    <div class="card">
      <h3>Receipt details ${headerLocked?`<button class="btn btn-small" onclick="grnEditHeaderSection()">✏️ Edit</button>`:''}</h3>
      ${headerFieldsHTML}
    </div>

    <div class="card">
      <h3>Bale-wise inward entry</h3>
      ${balesHTML || '<div class="empty">Enter "No. of bales" above, then press Enter or click Generate Bales to create the bale entry blocks</div>'}
      ${hasEntries ? `
      <div class="totals-bar ${matches?'match':'mismatch'}" style="align-items:center;">
        <span>Entered total: <b>${grandTotal}m</b> vs. Declared total: <b>${declared||0}m</b> — ${matches ? '✓ Matches, ready for QC' : '⚠ Does not match, recheck entries'}</span>
        <span class="grand-total-badge">${grandTotal}<small>m total</small></span>
      </div>` : ''}
    </div>

    ${Object.keys(perItem).length && !grnDraft.submitted ? `
    <div class="card">
      <h3>What happens on submit</h3>
      <p style="margin:0 0 6px; color:var(--ink-soft);">This shipment will be split into <b>${Object.keys(perItem).length}</b> separate quality check(s):</p>
      <ul style="margin:0; padding-left:18px;">${perItemRows}</ul>
    </div>` : ''}

    <div class="btn-row">
      ${grnDraft.submitted ? `
        <button class="btn btn-primary" onclick="grnSaveEditedBales()">Save Changes</button>
      ` : `
        <button class="btn btn-gold" onclick="grnSaveDraft()">${grnDraft.bales.length ? 'Save Progress (finish later)' : 'Save Header (add bales later)'}</button>
        <button class="btn btn-primary" ${matches?'':'disabled'} onclick="grnSubmit()">Submit GRN &amp; Send to QC</button>
      `}
      <button class="btn btn-red" onclick="go(grnDraft.submitted ? 'grn-detail' : 'grn-list', editingGrnId)">Cancel</button>
    </div>
    ${editingGrnId ? `<div class="card"><h3>History</h3>${auditLogHTML(grnDraft.auditLog)}</div>` : ''}
  `;
}
window.grnPieceKeydown = function(evt, bi, pi){
  if(evt.key !== 'Enter') return;
  evt.preventDefault();
  grnPieceMeter(bi, pi, evt.target.value);
  const nextInSameBale = document.getElementById('piece_'+bi+'_'+(pi+1));
  if(nextInSameBale){ nextInSameBale.focus(); nextInSameBale.select(); return; }
  const nextBaleFirst = document.getElementById('piece_'+(bi+1)+'_0');
  if(nextBaleFirst){ nextBaleFirst.focus(); nextBaleFirst.select(); }
};
window.grnLockHeaderSection = function(){
  if(!grnDraft.receivedDate){ toast('Received date is required before saving'); return; }
  const linkedPo = db.pos.find(p=>p.id===grnDraft.poId);
  if(linkedPo){
    const minD = linkedPo.sentToVendorDate || linkedPo.date;
    if(minD && grnDraft.receivedDate < minD){
      toast(`Receive Date cannot be earlier than PO date (${minD})`);
      return;
    }
  }
  if(editingGrnId){
    const idx = db.grns.findIndex(g=>g.id===editingGrnId);
    db.grns[idx] = { ...grnDraft, id: editingGrnId, headerLocked:true };
    logEvent(grnDraft.auditLog, 'Header section saved', '', 'GRN', 'GRN-'+editingGrnId);
  } else {
    const grn = { ...grnDraft, id: nextId(), submitted:false, headerLocked:true };
    db.grns.push(grn);
    editingGrnId = grn.id;
    logEvent(grn.auditLog, 'Header section saved', '', 'GRN', 'GRN-'+grn.id);
  }
  grnDraft.headerLocked = true;
  toast('Receipt details saved — now add bales below');
  paintGRNForm();
};
window.grnEditHeaderSection = function(){ grnDraft.headerLocked = false; paintGRNForm(); };
window.grnSaveEditedBales = function(){
  const idx = db.grns.findIndex(g=>g.id===editingGrnId);
  const grn = { ...grnDraft, id: editingGrnId, totalQty: Number(grnDraft.totalQty) };
  db.grns[idx] = grn;
  const perItemQty = {}, perItemPieces = {};
  grn.bales.forEach(b=>{
    if(!b.pieces.length) return;
    perItemQty[b.itemIdx] = (perItemQty[b.itemIdx]||0) + b.pieces.reduce((s,m)=>s+Number(m||0),0);
    perItemPieces[b.itemIdx] = (perItemPieces[b.itemIdx]||0) + b.pieces.length;
  });
  Object.entries(perItemQty).forEach(([idxStr, qty])=>{
    const itemIdx = Number(idxStr);
    let q = db.qcRecords.find(x=>x.grnId===editingGrnId && x.itemIdx===itemIdx);
    if(q && q.status==='Pending'){
      logChange(q.auditLog, 'Received quantity', q.receivedQty+'m', qty+'m', 'Quality Check', 'GRN-'+editingGrnId);
      q.receivedQty = qty; q.receivedPieces = perItemPieces[itemIdx];
    } else if(!q){
      const auditLog=[];
      logEvent(auditLog, 'Sent to Quality Check', 'Added via bale edit', 'Quality Check', 'GRN-'+editingGrnId);
      db.qcRecords.push({ id: nextId(), grnId: editingGrnId, poId: grn.poId, sourceType: grn.sourceType||'po', itemIdx, receivedQty: qty, receivedPieces: perItemPieces[itemIdx],
        checker:'', widthFound:'', foldFound:'', notes:'', photoDataUrls:[], defectivePieces:'', defectiveQty:'', defectReason:'', pieceInspections:[],
        status:'Pending', decidedAt:null, auditLog });
    }
    // if a qcRecord exists but is no longer Pending, that item's bales were locked and shouldn't have changed — skip silently
  });
  logEvent(grn.auditLog, 'Bale entries updated', '', 'GRN', 'GRN-'+editingGrnId);
  toast('Bale entries updated');
  go('grn-detail', editingGrnId);
};
window.paintGRNForm = paintGRNForm;
window.grnChangeSource = function(value){
  const parts = value.split(':');
  grnDraft.sourceType = parts[0]; grnDraft.poId = Number(parts[1]);
  grnDraft.bales=[]; grnDraft.numBales='';
  paintGRNForm();
};
window.grnGenerateBales = function(){
  const count = Math.max(0, parseInt(grnDraft.numBales)||0);
  if(count<=0){ toast('Enter the number of bales first'); return; }
  const bales = [];
  for(let i=0;i<count;i++){ bales.push(grnDraft.bales[i] || {baleNo:String(i+1), itemIdx:0, pieces:[]}); }
  grnDraft.bales = bales;
  toast(count+' bale section(s) generated');
  paintGRNForm();
};
window.grnBaleField = function(bi, field, value){ grnDraft.bales[bi][field]=value; paintGRNForm(); };
window.grnSetPieceCount = function(bi, n){
  const count = Math.max(0, parseInt(n)||0);
  const cur = grnDraft.bales[bi].pieces;
  const next = [];
  for(let i=0;i<count;i++) next.push(cur[i]!==undefined ? cur[i] : '');
  grnDraft.bales[bi].pieces = next;
  grnDraft.bales[bi]._pieceCountRaw = n;
  paintGRNForm();
};
window.grnPieceMeter = function(bi,pi,val){ grnDraft.bales[bi].pieces[pi] = val; paintGRNForm(); };
window.grnRemoveBale = function(bi){ grnDraft.bales.splice(bi,1); grnDraft.numBales=String(grnDraft.bales.length); paintGRNForm(); };
window.grnSaveDraft = function(){
  const po = db.pos.find(p=>p.id===grnDraft.poId);
  logEvent(grnDraft.auditLog, editingGrnId ? 'Progress saved' : 'Saved as draft', '', 'GRN', 'GRN-'+(editingGrnId||'new'));
  if(editingGrnId){
    const idx = db.grns.findIndex(g=>g.id===editingGrnId);
    db.grns[idx] = { ...grnDraft, id: editingGrnId };
    toast('GRN-'+editingGrnId+' progress saved — you can resume it anytime from the GRN Register');
    go('grn-list');
  } else {
    const grn = { ...grnDraft, id: nextId(), submitted:false };
    db.grns.push(grn);
    toast('GRN-'+grn.id+' saved as draft — finish bale entry anytime from the GRN Register');
    go('grn-list');
  }
};
window.grnSubmit = function(){
  logEvent(grnDraft.auditLog, 'Submitted to Quality Check', '', 'GRN', 'GRN-'+(editingGrnId||'new'));
  let grn;
  if(editingGrnId){
    grn = { ...grnDraft, id: editingGrnId, totalQty: Number(grnDraft.totalQty), submitted:true };
    const idx = db.grns.findIndex(g=>g.id===editingGrnId);
    db.grns[idx] = grn;
  } else {
    grn = { ...grnDraft, id: nextId(), totalQty: Number(grnDraft.totalQty), submitted:true };
    db.grns.push(grn);
  }

  // one QC record PER distinct fabric/width line item present in this shipment
  const perItem = {};
  const perItemPieces = {};
  grn.bales.forEach(b=>{
    if(!b.pieces.length) return;
    perItem[b.itemIdx] = (perItem[b.itemIdx]||0) + b.pieces.reduce((s,m)=>s+Number(m||0),0);
    perItemPieces[b.itemIdx] = (perItemPieces[b.itemIdx]||0) + b.pieces.length;
  });
  Object.entries(perItem).forEach(([idx, qty])=>{
    const auditLog = [];
    logEvent(auditLog, 'Sent to Quality Check', 'Received '+qty+'m across '+perItemPieces[idx]+' piece(s)', 'Quality Check', 'GRN-'+grn.id);
    db.qcRecords.push({
      id: nextId(), grnId: grn.id, poId: grn.poId, sourceType: grn.sourceType||'po', itemIdx: Number(idx), receivedQty: qty, receivedPieces: perItemPieces[idx],
      checker:'', widthFound:'', foldFound:'', notes:'', photoDataUrls:[],
      defectivePieces:'', defectiveQty:'', defectReason:'',
      status:'Pending', decidedAt:null, auditLog,
    });
  });
  // if this GRN is against a Job Challan, mark it Completed once all its lines have
  // reached a status other than "still awaiting receipt" — kept simple: just note that
  // a processing return has now been formally received against it.
  if((grn.sourceType||'po')==='challan'){
    const challan = db.jobChallans.find(c=>c.id===grn.poId);
    if(challan) logEvent(challan.auditLog, 'Processing GRN received', 'GRN-'+grn.id, 'Job Challan', 'Challan-'+challan.challanNo);
  }
  toast('GRN-'+grn.id+' submitted — '+Object.keys(perItem).length+' item(s) sent to Quality Check');
  go('grn-detail', grn.id);
};

function resolveSourceItem(sourceType, sourceId, itemIdx){
  if(sourceType==='challan'){
    const challan = db.jobChallans.find(c=>c.id===sourceId);
    const l = challan.lines[itemIdx];
    return { fabricId:l.fabricId, width:l.width, colorId:l.colorId };
  }
  const po = db.pos.find(p=>p.id===sourceId);
  return po.items[itemIdx];
}
window.damagedResolve = function(id, decision){
  const d = db.damagedItems.find(x=>x.id===id);
  const note = document.getElementById('dmg_note')?.value || '';

  // A damaged item's fabric should be in the Stock Pool if and only if its CURRENT
  // resolution is "Reversed". Remove any earlier stock entry tied to this exact
  // damaged item before applying the new decision, so flipping the resolution back
  // and forth (Reverse -> Return to Vendor -> Reverse again) can never double-count it.
  const existingEntry = db.stockPool.find(s=>s._damagedItemId===d.id);
  const hadStockEntry = !!existingEntry;
  if(existingEntry) db.stockPool = db.stockPool.filter(s=>s.id!==existingEntry.id);

  d.status = decision;
  d.decidedAt = todayISO();
  logEvent(d.auditLog, 'Resolution: '+decision, note + (hadStockEntry && decision!=='Reversed (treated as good)' ? ' (previously added stock entry removed)' : ''), 'Quality Check', 'GRN-'+d.grnId);

  if(decision==='Reversed (treated as good)'){
    const it = resolveSourceItem(d.sourceType, d.poId, d.itemIdx);
    pushStock(it.fabricId, it.width, it.colorId, d.defectiveQty, 'Reversed — defect overturned on review', d.decidedAt, { qcId: d.qcId, grnId: d.grnId, poId: d.poId, sourceType: d.sourceType, itemIdx: d.itemIdx, _damagedItemId: d.id });
    toast('Defect reversed — '+d.defectiveQty+'m added to Stock Pool');
  } else {
    toast('Damaged pieces marked: '+decision + (hadStockEntry ? ' — removed from Stock Pool' : ''));
  }
  go('damaged-item', id);
};

window.adminApprove = function(qcId){
  const q = db.qcRecords.find(x=>x.id===qcId);
  q.status = 'Approved';
  q.decidedAt = todayISO();
  logEvent(q.auditLog, 'Approved by Admin', '', 'Quality Check', 'GRN-'+q.grnId);
  const it = resolveSourceItem(q.sourceType, q.poId, q.itemIdx);
  const goodQty = Math.max(0, q.receivedQty - Number(q.defectiveQty||0));
  if(goodQty>0){
    pushStock(it.fabricId, it.width, it.colorId, goodQty, 'Admin approved', q.decidedAt, { qcId: q.id, grnId: q.grnId, poId: q.poId, sourceType: q.sourceType, itemIdx: q.itemIdx });

  toast('GRN-'+q.grnId+' item approved by admin — '+goodQty+'m added to Stock Pool');

};

window.qcCompare = function(){
  const w = document.getElementById('qc_width').value;
  const foldEl = document.getElementById('qc_fold');
  const fo = foldEl ? foldEl.value : '';
  const exp = window._qcExpected;
  let msgs = [];
  if(w && w!==exp.width) msgs.push(`Width differs from PO (expected ${exp.width})`);
  if(fo && exp.fold!==undefined && Number(fo)!==Number(exp.fold)) msgs.push(`Fold differs from PO (expected ${exp.fold}%)`);
  document.getElementById('qc_compare_msg').innerHTML = msgs.length
    ? `<div class="compare diff">⚠ ${msgs.join(' · ')}</div>`
    : `<div class="compare same">✓ Matches PO expectation</div>`;
};
window.qcDefectPreview = function(){
  const el = document.getElementById('qc_defect_preview');
  const pcs = document.getElementById('qc_defect_pieces').value;
  const qty = document.getElementById('qc_defect_qty').value;
  if(!pcs && !qty){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="compare diff" style="margin-top:22px;">⚠ Will hold back ${qty||0}m for admin review; goes to a separate register.</div>`;
};
/* ---- Bale / piece-level QC ----
   Renders a checkbox per physical piece in the GRN's bales for this item.
   Ticking a row reveals its own inspection fields WITHOUT re-rendering the
   page (so the checker/width/notes already typed above are never lost). */
function getPiecesForQC(q){
  const grn = db.grns.find(g=>g.id===q.grnId);
  const pieces = [];
  grn.bales.forEach((b, bi)=>{
    if(b.itemIdx !== q.itemIdx) return;
    b.pieces.forEach((m, pi)=>{
      pieces.push({ key: bi+'_'+pi, baleNo: b.baleNo, pieceNo: pi+1, meters: Number(m||0) });
    });
  });
  return pieces;
}
window._qcPieceData = {};
function qcPiecesListHTML(q){
  const pieces = getPiecesForQC(q);
  const it = resolveSourceItem(q.sourceType, q.poId, q.itemIdx);
  window._qcPieceData = {};
  if(!pieces.length) return '<div class="empty">No individual piece data recorded for this GRN.</div>';
  const rows = pieces.map(p=>`
    <div class="piece-row">
      <label class="piece-row-head"><input type="checkbox" onchange="togglePieceRow(this,'${p.key}')"> <b>Bale ${p.baleNo} — Piece ${p.pieceNo}</b> <span class="hint">(${p.meters}m)</span></label>
      <div id="piecedetail_${p.key}" style="display:none; margin-top:10px; padding:12px 14px; background:#FCFAF7; border:1px solid var(--line); border-radius:6px;">
        <div class="row">
          <div class="field small"><label>Actual width <span class="expected-tag">Expected: ${it.width}</span></label><input type="text" data-nocap id="pw_${p.key}"></div>
          ${it.fold!==undefined ? `<div class="field small"><label>Actual fold (%) <span class="expected-tag">Expected: ${it.fold}%</span></label><input type="number" id="pf_${p.key}"></div>` : ''}
          <div class="field small"><label>Status</label><select id="ps_${p.key}"><option>OK</option><option>Send for Admin Approval</option><option>Reject</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label>Notes</label><input type="text" id="pn_${p.key}"></div>
          <div class="field">
            <label>Photos <span class="hint">(more than one allowed)</span></label>
            <div style="display:flex; gap:8px;">
              <label class="btn btn-small" style="margin:0;">Choose File(s)<input type="file" accept="image/*" multiple style="display:none;" onchange="handlePiecePhoto(event,'${p.key}')"></label>
              <label class="btn btn-small btn-gold" style="margin:0;">📷 Camera<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="handlePiecePhoto(event,'${p.key}')"></label>
            </div>
            <div id="pphoto_${p.key}" class="photo-thumb-row"></div>
          </div>
        </div>
      </div>
    </div>`).join('');
  return `<div class="piece-list">${rows}</div>`;
}
window.togglePieceRow = function(checkbox, key){
  const div = document.getElementById('piecedetail_'+key);
  div.style.display = checkbox.checked ? 'block' : 'none';
};
window.handlePiecePhoto = function(evt, key){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  window._qcPieceData[key] = window._qcPieceData[key] || {photos:[]};
  if(!window._qcPieceData[key].photos) window._qcPieceData[key].photos = [];
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      window._qcPieceData[key].photos.push(e.target.result);
      renderPiecePhotoPreviews(key);
    };
    reader.readAsDataURL(file);
  });
  evt.target.value = '';
};
function renderPiecePhotoPreviews(key){
  const wrap = document.getElementById('pphoto_'+key);
  if(!wrap) return;
  const photos = (window._qcPieceData[key]||{}).photos || [];
  wrap.innerHTML = photos.map((src,i)=>`
    <div class="photo-thumb-item">
      <img class="photo-thumb" src="${src}" style="max-width:90px; max-height:70px;">
      <button type="button" class="photo-thumb-remove" onclick="removePiecePhoto('${key}',${i})">&times;</button>
    </div>`).join('');
}
window.removePiecePhoto = function(key, i){ window._qcPieceData[key].photos.splice(i,1); renderPiecePhotoPreviews(key); };
function collectFlaggedPieces(q){
  const pieces = getPiecesForQC(q);
  const flagged = [];
  pieces.forEach(p=>{
    const detailDiv = document.getElementById('piecedetail_'+p.key);
    if(!detailDiv || detailDiv.style.display==='none') return;
    flagged.push({
      key: p.key, baleNo: p.baleNo, pieceNo: p.pieceNo, meters: p.meters,
      actualWidth: document.getElementById('pw_'+p.key).value,
      actualFold: document.getElementById('pf_'+p.key).value,
      status: document.getElementById('ps_'+p.key).value,
      notes: document.getElementById('pn_'+p.key).value,
      photos: ((window._qcPieceData[p.key]||{}).photos || []).slice(),
    });
  });
  return flagged;
}
window.handleQcPhoto = function(evt){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = function(e){
      window._qcPhotos.push(e.target.result);
      renderQcPhotoPreviews();
    };
    reader.readAsDataURL(file);
  });
  evt.target.value = '';
};
function renderQcPhotoPreviews(){
  const wrap = document.getElementById('qc_photo_preview_wrap');
  if(!wrap) return;
  wrap.innerHTML = window._qcPhotos.map((src,i)=>`
    <div class="photo-thumb-item">
      <img class="photo-thumb" src="${src}">
      <button type="button" class="photo-thumb-remove" onclick="removeQcPhoto(${i})">&times;</button>
    </div>`).join('');
}
window.removeQcPhoto = function(i){ window._qcPhotos.splice(i,1); renderQcPhotoPreviews(); };
window.qcDecide = function(qcId, decision){
  const checker = document.getElementById('qc_checker').value.trim();
  if(!checker){ toast('Checker name is required'); return; }
  const q = db.qcRecords.find(x=>x.id===qcId);
  const defectPieces = document.getElementById('qc_defect_pieces').value;
  const defectQty = Number(document.getElementById('qc_defect_qty').value)||0;
  const defectReason = document.getElementById('qc_defect_reason').value.trim();
  if(defectQty>0 && !defectReason){ toast('Please give a reason for the defective pieces'); return; }

  const flaggedPieces = collectFlaggedPieces(q);
  const issuePieces = flaggedPieces.filter(p=>p.status!=='OK');
  const pieceQtyHeldBack = issuePieces.reduce((s,p)=>s+p.meters,0);

  q.checker = checker;
  q.widthFound = document.getElementById('qc_width').value;
  const fabricMatchingEl = document.getElementById('qc_fabric_matching');
  if(fabricMatchingEl){
    q.fabricMatchingChecked = fabricMatchingEl.value;
    q.fabricMatchingCheckedBy = document.getElementById('qc_fabric_matching_by').value;
    q.colorBleedingChecked = document.getElementById('qc_color_bleeding').value;
    q.colorBleedingCheckedBy = document.getElementById('qc_color_bleeding_by').value;
  }
  const foldEl = document.getElementById('qc_fold');
  q.foldFound = foldEl ? foldEl.value : '';
  q.notes = document.getElementById('qc_notes').value;
  q.photoDataUrls = window._qcPhotos.slice();
  q.decidedAt = todayISO();
  q.defectivePieces = defectPieces;
  q.defectiveQty = defectQty;
  q.defectReason = defectReason;
  q.pieceInspections = flaggedPieces;

  let damagedNote = '';
  if(defectQty>0){
    const auditLog = [];
    logEvent(auditLog, 'Reported during QC', defectReason, 'Quality Check', 'GRN-'+q.grnId);
    db.damagedItems.push({
      id: nextId(), qcId: q.id, grnId: q.grnId, poId: q.poId, sourceType: q.sourceType, itemIdx: q.itemIdx,
      defectivePieces: defectPieces, defectiveQty: defectQty, reason: defectReason,
      reportedBy: checker, reportedAt: todayISO(), status:'Pending Admin Review', decidedAt:null, auditLog,
    });
    damagedNote = ' — '+defectQty+'m held back for admin review';
  }
  issuePieces.forEach(p=>{
    const auditLog = [];
    logEvent(auditLog, 'Flagged during piece-level QC', 'Bale '+p.baleNo+', Piece '+p.pieceNo+' — '+p.status, 'Quality Check', 'GRN-'+q.grnId);
    db.damagedItems.push({
      id: nextId(), qcId: q.id, grnId: q.grnId, poId: q.poId, sourceType: q.sourceType, itemIdx: q.itemIdx,
      baleNo: p.baleNo, pieceNo: p.pieceNo, actualWidth: p.actualWidth, actualFold: p.actualFold, photoDataUrls: p.photos,
      defectivePieces: 1, defectiveQty: p.meters, reason: p.notes || ('Flagged: '+p.status),
      reportedBy: checker, reportedAt: todayISO(),
      status: p.status==='Reject' ? 'Pending Admin Review' : 'Pending Admin Review', decidedAt:null, auditLog,
    });
  });
  if(issuePieces.length) damagedNote += ' — '+issuePieces.length+' individually flagged piece(s) held back';

  const goodQty = Math.max(0, q.receivedQty - defectQty - pieceQtyHeldBack);

  if(decision==='OK'){
    q.status = 'OK';
    logEvent(q.auditLog, 'Marked OK by QC', checker + (defectQty>0||issuePieces.length?' (with defect reported)':''), 'Quality Check', 'GRN-'+q.grnId);
    if(goodQty>0){
      const it = resolveSourceItem(q.sourceType, q.poId, q.itemIdx);
      pushStock(it.fabricId, it.width, it.colorId, goodQty, 'QC approved', q.decidedAt, { qcId: q.id, grnId: q.grnId, poId: q.poId, sourceType: q.sourceType, itemIdx: q.itemIdx });
    }
    toast('Item marked OK — '+goodQty+'m added to Stock Pool'+damagedNote);
    openModal(`
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h3>Added to Stock Pool</h3>
      <div class="modal-sub">${goodQty}m is now available in stock.${(defectQty>0||issuePieces.length)?' The flagged portion was held back and sent to the Damaged/Rejected register.':''}</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="closeModal(); go('stock-list');">View Stock Pool</button>
        <button class="btn" onclick="closeModal(); go('grn-detail', ${q.grnId});">Back to GRN</button>
      </div>
    `);
  } else {
    q.status = 'Pending Admin Approval';
    logEvent(q.auditLog, 'Sent for Admin Approval', checker + (defectQty>0||issuePieces.length?' (with defect reported)':''), 'Quality Check', 'GRN-'+q.grnId);
    toast('Item sent for Admin Approval'+damagedNote);
    go('qc-item', qcId);
  }
};

function renderStock(){
  // group identical fabric+width+colour together for a clean, unambiguous summary —
  // this is exactly what keeps different colours of the same fabric/width from being
  // lumped into one number when someone is deciding what's available for cutting.
  const groups = {};
  db.stockPool.forEach(s=>{
    const key = s.fabricId+'|'+s.width+'|'+(s.colorId||'greige');
    if(!groups[key]) groups[key] = { fabricId:s.fabricId, width:s.width, colorId:s.colorId, qty:0, entries:[] };
    groups[key].qty += s.qty; groups[key].entries.push(s);
  });
  const groupRows = Object.values(groups).sort((a,b)=>fabricName(a.fabricId).localeCompare(fabricName(b.fabricId))).map(g=>`
    <tr class="clickable" onclick="go('stock-detail', ${g.entries[0].id})">
      <td>${fabricName(g.fabricId)}</td>
      <td>${g.width}</td>
      <td>${g.colorId ? `<span class="legend-dot" style="background:${db.colors.find(c=>c.id===g.colorId)?.hex||'#ccc'};"></span> ${colorName(g.colorId)}` : '<span class="hint">Greige (undyed)</span>'}</td>
      <td class="amt"><b>${g.qty.toFixed(1)}m</b></td>
      <td>${g.entries.length} lot(s)</td>
      <td class="chev">›</td>
    </tr>`).join('');
  main.innerHTML = `
    <div class="pagehead">
      <div class="crumb">Step 5</div>
      <h1>Stock Pool</h1>
      <p>Fabric that has passed quality check (directly, or via admin approval), or returned from processing/dyeing, and is now available for use — tracked separately by fabric, width <b>and colour</b>, so nothing gets lumped together.</p>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Fabric</th><th>Width</th><th>Colour</th><th>Available quantity</th><th>Lots</th><th></th></tr></thead>
        <tbody>${groupRows || '<tr><td colspan="6" class="empty">Nothing in stock yet — complete a QC to see it land here.</td></tr>'}</tbody>
      </table>
    </div>`;
}
function renderStockDetail(stockId){
  const s = db.stockPool.find(x=>x.id===stockId);
  if(!s){ go('stock-list'); return; }
  const sameGroup = db.stockPool.filter(x=>x.fabricId===s.fabricId && x.width===s.width && (x.colorId||null)===(s.colorId||null));
  const totalQty = sameGroup.reduce((sum,x)=>sum+x.qty,0);
  const lotRows = sameGroup.map(lot=>{
    let sourceDocLabel, traceLink;
    if(lot.grnId){
      const grn = db.grns.find(g=>g.id===lot.grnId);
      const src = grn ? resolveGrnSource(grn) : null;
      sourceDocLabel = 'GRN-'+lot.grnId+' / '+(src?src.ref:(lot.sourceType==='challan'?('Challan-'+lot.poId):('PO-'+lot.poId)));
      traceLink = `<a href="#" onclick="go('grn-detail', ${lot.grnId}); return false;">View GRN</a>`;
    } else {
      sourceDocLabel = 'Manually reversed from a damaged-item record';
      traceLink = `<a href="#" onclick="go('qc-list'); return false;">View Quality Check</a>`;
    }
    return `<tr><td class="amt">${lot.qty.toFixed(1)}m</td><td>${lot.source}</td><td>${sourceDocLabel}</td><td>${lot.decidedAt}</td><td>${traceLink}</td></tr>`;
  }).join('');
  main.innerHTML = `
    <div class="pagehead">
      <div class="crumb"><span class="back" onclick="go('stock-list')">← back to Stock Pool</span></div>
      <h1>${fabricName(s.fabricId)} — ${s.width} ${s.colorId?('· '+colorName(s.colorId)):'· Greige'}</h1>
      <p><b>${totalQty.toFixed(1)}m</b> currently available across ${sameGroup.length} lot(s).</p>
    </div>
    <div class="card">
      <h3>Lots making up this balance</h3>
      <table>
        <thead><tr><th>Quantity</th><th>Source</th><th>Document</th><th>Date</th><th></th></tr></thead>
        <tbody>${lotRows || '<tr><td colspan="5" class="empty">No lots</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function seriesListHTML(){
  const sorted = db.sizeSeries.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const rows = sorted.map(s=>`
    <tr draggable="true" ondragstart="seriesDragStart(event,${s.id})" ondragover="event.preventDefault()" ondrop="seriesDrop(event,${s.id})" style="cursor:grab;">
      <td style="width:24px; color:var(--ink-soft); font-size:16px;">⠿⠿</td>
      <td class="clickable" onclick="openSeriesModal(null,${s.id})"><b>${s.name}</b></td>
      <td class="clickable" onclick="openSeriesModal(null,${s.id})">${s.sizes.map(z=>z.display).join(', ')}</td>
      <td><button class="btn-link" onclick="confirmDelete('this size series', 'deleteSeries(${s.id})')">Delete</button></td>
    </tr>`).join('');
  return `<div class="card"><h3>Size Series <button class="btn btn-gold btn-small" onclick="openSeriesModal()">+ New Series</button></h3>
    <p class="hint" style="margin:0 0 12px;">Drag rows by the handle (⠿⠿) to reorder — this is the order series are offered in on an order. Click a row to manage its sizes.</p>
    <table><thead><tr><th></th><th>Series</th><th>Sizes</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">No series yet</td></tr>'}</tbody></table></div>`;
}
window.seriesDragStart = function(e, id){ e.dataTransfer.setData('text/plain', String(id)); };
window.seriesDrop = function(e, targetId){
  e.preventDefault();
  const draggedId = Number(e.dataTransfer.getData('text/plain'));
  if(draggedId===targetId) return;
  const sorted = db.sizeSeries.slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const draggedIdx = sorted.findIndex(s=>s.id===draggedId);
  const targetIdx = sorted.findIndex(s=>s.id===targetId);
  const [moved] = sorted.splice(draggedIdx,1);
  sorted.splice(targetIdx,0,moved);
  sorted.forEach((s,i)=> s.order=i+1);
  toast('Series order updated');
  renderOrderMasters();
};
window.deleteSeries = function(id){ db.sizeSeries = db.sizeSeries.filter(s=>s.id!==id); closeModal(); toast('Series deleted'); renderOrderMasters(); };
function openSeriesModal(cb, editId){
  const s = editId ? db.sizeSeries.find(x=>x.id===editId) : null;
  window._seriesDraft = s ? JSON.parse(JSON.stringify(s)) : { name:'', sizes:[] };
  window._seriesCb = cb; window._seriesEditId = editId;
  paintSeriesModal();
}
window.openSeriesModal = openSeriesModal;
function paintSeriesModal(){
  const d = window._seriesDraft;
  openModal(`
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3>${window._seriesEditId?'Edit Size Series':'New Size Series'}</h3>
    <div class="row"><div class="field"><label>Series name <span class="req">*</span></label><input type="text" placeholder="e.g. Alpha, Numeric, Mix Sizes" value="${d.name}" onchange="window._seriesDraft.name=this.value"></div></div>
    <div class="hint" style="margin:12px 0 6px;">Sizes in this series (unlimited, shown in this order):</div>
    ${d.sizes.map((sz,i)=>`
      <div class="row" style="align-items:flex-end;">
        <div class="field small"><label>Size name</label><input type="text" value="${sz.name}" onchange="seriesSizeField(${i},'name',this.value)"></div>
        <div class="field small"><label>Display name</label><input type="text" value="${sz.display}" onchange="seriesSizeField(${i},'display',this.value)"></div>
        <div class="field"><label>Description</label><input type="text" value="${sz.desc}" onchange="seriesSizeField(${i},'desc',this.value)"></div>
        <div class="field small"><button class="btn-link" onclick="seriesRemoveSize(${i})">Remove</button></div>
      </div>`).join('')}
    <button class="btn-link" onclick="seriesAddSize()">+ Add more size</button>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-primary" onclick="saveSeries()">${window._seriesEditId?'Save Changes':'Save Series'}</button>
      ${window._seriesEditId?`<button class="btn btn-red" onclick="confirmDelete('this size series', 'deleteSeries('+window._seriesEditId+')')">Delete</button>`:''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `, true);
}
window.seriesAddSize = function(){ window._seriesDraft.sizes.push({id:nextId(), name:'', display:'', desc:''}); paintSeriesModal(); };
window.seriesRemoveSize = function(i){ window._seriesDraft.sizes.splice(i,1); paintSeriesModal(); };
window.seriesSizeField = function(i, field, value){
  window._seriesDraft.sizes[i][field]=value;
  if(field==='name' && !window._seriesDraft.sizes[i].display) window._seriesDraft.sizes[i].display=value;
};
window.saveSeries = function(){
  const name = window._seriesDraft.name.trim();
  const sizes = window._seriesDraft.sizes;
  if(!name || !sizes.length){ toast('Series name and at least one size are required'); return; }
  let s;
  if(window._seriesEditId){ s=db.sizeSeries.find(x=>x.id===window._seriesEditId); Object.assign(s, {name, sizes}); }
  else { s={id:nextId(), name, order:db.sizeSeries.length+1, sizes}; db.sizeSeries.push(s); }
  closeModal(); toast('Series "'+name+'" saved');
  if(typeof window._seriesCb==='function') window._seriesCb(s); else if(currentView==='order-masters') renderOrderMasters();
};

window.accField = function(field, value){
  syncAccessoryTagsIntoDraft();
  window._accDraft[field] = value;
  if(field === 'category' && value === 'Lace'){
    delete window._accDraft.piecesPerUnit;
    window._accDraft.unit = 'Meter';
  }
  if(['category','threadPattern','tasselType','laceSizeValue','laceSizeUnit','sizeValue','sizeUnit'].includes(field)){ paintAccessoryModal(); }
};
window.accRowField = function(arrName, i, field, value){ window._accDraft[arrName][i][field]=value; };
window.accAddRow = function(arrName, template){ syncAccessoryTagsIntoDraft(); window._accDraft[arrName].push(template); paintAccessoryModal(); };
window.accRemoveRow = function(arrName, i){ syncAccessoryTagsIntoDraft(); window._accDraft[arrName].splice(i,1); paintAccessoryModal(); };
window.saveAccessory = function(){
  syncAccessoryTagsIntoDraft();
  const d = window._accDraft;
  const name = (d.name||'').trim();
  if(!name){ toast('Accessory name is required'); return; }
  d.name = name;
  if(d.category === 'Lace'){
    delete d.piecesPerUnit;
  }
  let a;
  if(window._accEditId){ a=db.accessories.find(x=>x.id===window._accEditId); Object.assign(a, d); }
  else { a={id:nextId(), ...d}; db.accessories.push(a); }
  closeModal(); toast('Accessory "'+name+'" saved');
  if(typeof window._accCb==='function') window._accCb(a); else if(currentView==='order-masters') renderOrderMasters();
};

function sumCustomerPieces(c){
  let total = 0;
  (c.sizeEntries||[]).forEach(se=>{
    (se.seriesEntries||[]).forEach(sen=>{
      Object.values(sen.qty||{}).forEach(q=> total += Number(q||0));
    });
  });
  return total;
}

    (cust.sizeEntries||[]).filter(se=>se.articleId===articleId && se.colorId===colorId).forEach(se=>{
