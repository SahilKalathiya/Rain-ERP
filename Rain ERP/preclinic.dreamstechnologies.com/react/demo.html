function rebuildConsumptionRows(){
  const needed = [];
  orderDraft.articles.forEach(art=>{
    (art.fabrics||[]).forEach((fr, fri)=>{
      const colorPcs = {};
      orderDraft.customers.forEach(cust=>{
        if(!(cust.articleIds||[]).includes(art.id)) return;
        (cust.sizeEntries||[]).filter(se=>se.articleId===art.id).forEach(se=>{
          const pcs = (se.seriesEntries||[]).reduce((s,sen)=>s+Object.values(sen.qty||{}).reduce((x,q)=>x+Number(q||0),0),0);
          if(pcs>0) colorPcs[se.colorId] = (colorPcs[se.colorId]||0) + pcs;
        });
      });
      Object.entries(colorPcs).forEach(([colorId,pcs])=>{
        const key = art.id+'_'+fri+'_'+colorId;
        needed.push({ key, articleId:art.id, fabricRoleIdx:fri, role:fr.role||'Fabric', fabricId:fr.fabricId, source:fr.source||'Greige Fabric', colorId:Number(colorId), pcs });
      });
    });
  });
  orderDraft.consumption = needed.map(n=>{
    const existing = (orderDraft.consumption||[]).find(c=>c.key===n.key);
    const fabric = db.fabrics.find(f=>f.id===n.fabricId);
    return { ...n, width: existing?.width || (fabric?fabric.widths[0]:''), dyedPerPiece: existing?.dyedPerPiece ?? '', locked: existing?.locked || false };
  });
  return orderDraft.consumption;
}

            </div>` : ''}
          </div>`);

    });

    return `
    <div class="customer-card">
      <div class="item-top">
        <div style="font-weight:600; font-size:15px;">👤 Customer ${ci+1} <span class="pill pill-closed">${custPcs} pcs</span></div>
        <button class="btn-link" onclick="orderRemoveCustomer(${ci})">Remove</button>
      </div>
      <div class="row">
        <div class="field">
          <label>Customer</label>
          <div class="inline-add">
            <select onchange="orderCustField(${ci},'customerId',Number(this.value))">
              ${db.customers.map(c=>`<option value="${c.id}" ${cust.customerId===c.id?'selected':''}>${c.name}</option>`).join('')}
            </select>
            <button class="btn btn-small" onclick="openCustomerModal((c)=>{orderCustField(${ci},'customerId',c.id); paintOrderForm();})">+ New</button>
          </div>
        </div>
      </div>
      <div class="section-divider"></div>
      <div class="hint" style="margin:0 0 6px;">Articles for this customer:</div>
      <div class="chip-row">${articleChips || '<span class="hint">Add articles above first</span>'}</div>
      <div class="section-divider"></div>
      <div class="hint" style="margin:0 0 6px;">Colors:</div>
      <div class="chip-row">${colorChips} <button class="btn-link" onclick="openColorModal((c)=>{orderCustToggleColor(${ci},c.id); paintOrderForm();})">+ New color</button></div>
      ${sizeBlocks.length ? `<div class="section-divider"></div><div class="hint" style="margin:0 0 8px;">Sizes &amp; quantities:</div>${sizeBlocks.join('')}` : ''}
    </div>`;
  }).join('');

  const consumption = rebuildConsumptionRows();
  const consumptionRows = consumption.map(row=>{
    const fabric = db.fabrics.find(f=>f.id===row.fabricId);
    const isGreige = row.source === 'Greige Fabric';
    const shrinkPct = isGreige ? (fabric?fabric.shrinkage:0) : 0;
    const maxBufferPct = fabric?(fabric.maxBuffer||0):0;
    const dyed = Number(row.dyedPerPiece||0);
    // Greige source: convert dyed requirement up to greige using shrinkage. Dyed/Stock source:
    // fabric is bought already at spec, so required qty = dyed qty directly, no shrink conversion.
    const greigePerPc = isGreige ? dyed * (1 + shrinkPct/100) : dyed;
    const totalDyed = dyed * row.pcs;
    const totalGreige = greigePerPc * row.pcs;
    const orderQty = totalGreige * (1 + maxBufferPct/100);
    const locked = !!row.locked;
    return { row, fabric, shrinkPct, totalDyed, totalGreige, orderQty, html: `
      <tr>
        <td>${articleTypeName(orderDraft.articles.find(a=>a.id===row.articleId)?.articleTypeId)} <span class="hint">(${row.role})</span></td>
        <td>${fabric?fabric.quality:'—'}<br><span class="hint">${row.source}</span></td>
        <td>${locked ? row.width : `<select onchange="orderConsumptionField('${row.key}','width',this.value)">${(fabric?fabric.widths:[]).map(w=>`<option ${row.width===w?'selected':''}>${w}</option>`).join('')}</select>`}</td>

        <td>${locked ? (row.dyedPerPiece||'—') : `<input type="number" style="width:70px;" value="${row.dyedPerPiece}" placeholder="m/pc" onchange="orderConsumptionField('${row.key}','dyedPerPiece',this.value)">`}</td>
        <td>${isGreige ? shrinkPct+'%' : '<span class="hint">— (already '+(row.source==='Dyed Fabric'?'dyed':'in stock')+')</span>'}</td>
        <td class="amt">${greigePerPc?greigePerPc.toFixed(2):'—'}</td>
        <td class="amt">${row.pcs}</td>
        <td class="amt">${totalDyed?totalDyed.toFixed(1):'—'}</td>
        <td class="amt">${totalGreige?totalGreige.toFixed(1):'—'}</td>
        <td class="amt">${maxBufferPct}% <span class="hint">(from Fabric Master)</span></td>
        <td class="amt"><b>${orderQty?orderQty.toFixed(1):'—'}</b></td>
        <td>${locked
          ? `<button class="btn-link" onclick="orderConsumptionField('${row.key}','locked',false)">Edit</button> <button class="btn-link" onclick="orderConsumptionDelete('${row.key}')">Delete</button>`
          : `<button class="btn-link" onclick="orderConsumptionField('${row.key}','locked',true)">Save</button>`}</td>
        <td><button class="btn btn-small btn-gold" onclick="openOrderFabricModal('${row.key}')">📦 Order</button></td>
      </tr>`};
  });
  // group subtotal per fabric+width
  const groups = {};
  consumptionRows.forEach(({row,fabric,totalDyed,totalGreige,orderQty})=>{
    const gk = (fabric?fabric.quality:'—')+' ('+row.width+')';
    if(!groups[gk]) groups[gk] = {pcs:0, dyed:0, greige:0, orderQty:0};
    groups[gk].pcs += row.pcs; groups[gk].dyed += totalDyed; groups[gk].greige += totalGreige; groups[gk].orderQty += orderQty;
  });

  const readinessRows = materialReadinessForOrder();
  const activeAccessories = db.accessories.filter(a=>a.active!==false);
  const categoriesWithCounts = ACCESSORY_CATEGORIES.map(cat=>({ cat, count: activeAccessories.filter(a=>a.category===cat).length })).filter(c=>c.count>0);
  const accessoriesInSelectedCategory = selectedAccessoryCategory ? activeAccessories.filter(a=>a.category===selectedAccessoryCategory) : [];
  const accessoryConfigCards = (orderDraft.accessoryConfigs||[]).map((cfg, cai)=>{
    const acc = db.accessories.find(a=>a.id===cfg.accessoryId);
    const totalRequiredQty = pcsForArticleColor(cfg.articleId, cfg.colorId);
    const baseQty = Number(cfg.reqQtyPerPiece||0) * totalRequiredQty;
    const maxBuffer = acc ? Number(acc.maxBuffer||0) : 0;
    const bufferAmt = baseQty * (Number(cfg.bufferPct||0)/100);
    const totalFinal = baseQty + Number(cfg.extraQty||0) + bufferAmt;
    const hasSource = acc && acc.category!=='Thread' && acc.category!=='Dori' && acc.category!=='Elastic' && acc.category!=='Beads & Sequins';
    const isTassel = acc && acc.category==='Tassel';
    if(!cfg.editing){
      return `<div class="item-card">
        <div class="item-top">
          <div><b>${ACCESSORY_EMOJI[acc?.category]||'🔘'} ${acc?acc.name:'—'}</b> <span class="hint">${articleTypeName(orderDraft.articles.find(a=>a.id===cfg.articleId)?.articleTypeId)} · ${colorName(cfg.colorId)}${hasSource?(' · '+cfg.source):''}</span></div>
          <div><button class="btn-link" onclick="orderAccEdit(${cai})">Edit</button> <button class="btn-link" onclick="orderAccDelete(${cai})">Delete</button></div>
        </div>
        <div class="compare">Placement: ${cfg.placement||'—'} · Size: ${cfg.size||'—'} ${acc && acc.category!=='Thread' ? (' · Accessory colour: '+(cfg.accessoryColor||'—')) : ''}${cfg.source==='Job Work'?(' · Fabric colour: '+(cfg.fabricColor||'—')):''}</div>
        <div class="compare">Req/pc: ${cfg.reqQtyPerPiece||0} · Extra: ${cfg.extraQty||0} · Buffer: ${cfg.bufferPct||0}% (max ${maxBuffer}%) = ${bufferAmt.toFixed(1)} · <b>Total final qty: ${totalFinal.toFixed(1)}</b></div>
      </div>`;
    }
    const sizeField = acc && acc.category==='Button' && acc.variants && acc.variants.length
      ? `<select onchange="orderAccField(${cai},'size',this.value)">${acc.variants.map(v=>`<option ${cfg.size===v?'selected':''}>${v}</option>`).join('')}</select>`
      : acc && acc.category==='Lace' && acc.laceSizeValue
      ? `<div style="padding:8px 0; font-weight:600;">${acc.laceSizeValue} ${acc.laceSizeUnit||'mm'} <span class="hint">(fixed by master)</span></div>`
      : `<input type="text" value="${cfg.size}" onchange="orderAccField(${cai},'size',this.value)">`;
    const colourField = acc && acc.category==='Button' && acc.colors && acc.colors.length
      ? `<select onchange="orderAccField(${cai},'accessoryColor',this.value)">${acc.colors.map(c=>`<option ${cfg.accessoryColor===c?'selected':''}>${c}</option>`).join('')}</select>`
      : `<input type="text" value="${cfg.accessoryColor}" onchange="orderAccField(${cai},'accessoryColor',this.value)">`;
    const placementField = acc && acc.placements && acc.placements.length
      ? `<select onchange="orderAccField(${cai},'placement',this.value)">${acc.placements.map(p=>`<option ${cfg.placement===p?'selected':''}>${p}</option>`).join('')}</select>`
      : `<input type="text" value="${cfg.placement}" placeholder="Front, Back, Sleeve, Collar…" onchange="orderAccField(${cai},'placement',this.value)">`;
    const fabricRefHint = acc && ['Dori','Elastic','Beads & Sequins'].includes(acc.category) && acc.fabricRows && acc.fabricRows.length
      ? `<div class="hint">Consumption source: ${acc.fabricRows.map(r=>fabricName(r.fabricId)).join(', ')} (from Accessory Master)</div>` : '';
    return `<div class="item-card">
      <div class="item-top"><b>${ACCESSORY_EMOJI[acc?.category]||'🔘'} ${acc?acc.name:'—'}</b> <span class="hint">${acc?acc.category:''}</span>
        <button class="btn-link" onclick="orderAccCancel(${cai})">Cancel</button>
      </div>
      <div class="row">
        <div class="field"><label>Article</label><select onchange="orderAccField(${cai},'articleId',Number(this.value))">${orderDraft.articles.map(a=>`<option value="${a.id}" ${cfg.articleId===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div>
        <div class="field"><label>Colour (of selected article)</label><select onchange="orderAccField(${cai},'colorId',Number(this.value))">${db.colors.map(c=>`<option value="${c.id}" ${cfg.colorId===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>Placement</label>${placementField}</div>
        ${acc && acc.category!=='Thread' ? `<div class="field"><label>Accessory colour</label>${colourField}</div>` : ''}
        <div class="field small"><label>Size</label>${sizeField}</div>
      </div>
      ${fabricRefHint}
      ${hasSource ? `
      <div class="row">
        <div class="field small"><label>Source</label>
          ${isTassel
            ? `<div style="padding:8px 0; font-weight:600;">${acc.tasselType} <span class="hint">(fixed by master)</span></div>`
            : `<select onchange="orderAccField(${cai},'source',this.value)">${['Ready Made','Job Work'].map(s=>`<option ${cfg.source===s?'selected':''}>${s}</option>`).join('')}</select>`}
        </div>
        ${(cfg.source==='Job Work'||(isTassel&&acc.tasselType==='Job Work')) ? `<div class="field"><label>Fabric colour <span class="req">*</span></label><input type="text" value="${cfg.fabricColor}" onchange="orderAccField(${cai},'fabricColor',this.value)"></div>` : ''}
      </div>` : ''}
      <div class="row">
        <div class="field small"><label>Required qty / piece <span class="hint">(for ${totalRequiredQty} pcs)</span></label><input type="number" value="${cfg.reqQtyPerPiece}" onchange="orderAccField(${cai},'reqQtyPerPiece',this.value)"></div>
        <div class="field small"><label>Extra / packing qty</label><input type="number" value="${cfg.extraQty}" onchange="orderAccField(${cai},'extraQty',this.value)"></div>
        <div class="field small">
          <label>Buffer % <span class="expected-tag">Max: ${maxBuffer}%</span></label>
          <input type="number" max="${maxBuffer}" value="${cfg.bufferPct}" onchange="orderAccBufferField(${cai},this.value,${maxBuffer})">
          <div class="hint">= ${bufferAmt.toFixed(1)}</div>
        </div>
        <div class="field small"><label>Total final qty</label><div style="padding:8px 0; font-weight:700;">${totalFinal.toFixed(1)}</div></div>
      </div>
      <div class="btn-row" style="margin-top:6px;">
        <button class="btn btn-primary btn-small" onclick="orderAccSave(${cai})">Save</button>
        <button class="btn btn-red btn-small" onclick="orderAccDelete(${cai})">Delete</button>
      </div>
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="pagehead">
      <div class="crumb"><span class="back" onclick="go('order-list')">← back to Sales Orders</span></div>
      <h1>${isEdit ? 'Edit Order SO-'+editingOrderId : 'New Sales Order'}</h1>
      <p>Order intake with article, fabric requirement (incl. dyeing shrinkage &amp; buffer), size series and per-customer colour/quantity breakdown.</p>
    </div>

    <div class="card">
      <h3>Order information</h3>
      <div class="row">
        <div class="field"><label>Style name <span class="req">*</span></label><input type="text" placeholder="e.g. Ikkat Black Kurta Set" value="${orderDraft.styleName}" onchange="orderDraft.styleName=this.value"></div>
        <div class="field small"><label>Order date</label><input type="date" value="${orderDraft.orderDate}" onchange="orderDraft.orderDate=this.value"></div>
      </div>
      <div class="row">
        <div class="field small"><label>Expected delivery</label><input type="date" value="${orderDraft.expectedDelivery}" onchange="orderDraft.expectedDelivery=this.value"></div>
        <div class="field small"><label>Priority</label><select onchange="orderDraft.priority=this.value">${['Normal','High','Urgent'].map(p=>`<option ${orderDraft.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
      </div>
    </div>

    <div class="card">
      <h3>Articles <span class="hint">select article types (each can only be added once)</span></h3>
      <div class="article-grid">
        ${visibleTypes.map(a=>articleTileHTML(a, selectedTypeIds.includes(a.id))).join('')}
        ${!showAllArticleTypes && hiddenCount>0 ? `<div class="article-tile others" onclick="showAllArticleTypes=true; paintOrderForm();">+${hiddenCount} Others</div>` : ''}
        <div class="article-tile add-new" onclick="openArticleTypeModal((a)=>{orderToggleArticle(a.id); paintOrderForm();})">+ New article type</div>
      </div>
      ${orderDraft.articles.length ? `<div class="hint" style="margin:16px 0 8px;">Added articles (${orderDraft.articles.length}):</div>${articlesHTML}` : ''}
    </div>

    <div class="card">
      <h3>Customers &amp; Orders <button class="btn btn-small" onclick="orderAddCustomer()">+ Add customer</button></h3>
      ${customersHTML || '<div class="empty">Add a customer to start assigning articles, colors and sizes</div>'}
    </div>

    ${showPlanning ? `
    <div class="card">
      <h3>Fabric colour &amp; consumption</h3>
      <p class="hint" style="margin:0 0 12px;">One row per article / fabric role / colour combination. Greige-sourced fabric converts Dyed → Greige using the fabric's shrinkage; Dyed/Stock-sourced fabric needs no conversion. Buffer % is fetched automatically from the Fabric Master — no need to enter it here.</p>
      ${consumptionRows.length ? `
      <table>
        <thead><tr><th>Article</th><th>Fabric</th><th>Width</th><th>Colour</th><th>Dyed (m/pc)</th><th>Shrink%</th><th>Greige/pc</th><th>Pcs</th><th>Total Dyed</th><th>Total Greige</th><th>Buffer%</th><th>Order Qty</th><th></th><th></th></tr></thead>
        <tbody>${consumptionRows.map(r=>r.html).join('')}</tbody>
      </table>
      <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;">
        ${Object.entries(groups).map(([gk,g])=>`<div class="compare" style="margin-bottom:4px;"><b>${gk}</b> — ${g.pcs} pcs · Dyed ${g.dyed.toFixed(1)}m · Greige ${g.greige.toFixed(1)}m · <b>Order Qty ${g.orderQty.toFixed(1)}m</b></div>`).join('')}
      </div>` : '<div class="empty">Add articles, customers, colors and sizes above to see fabric requirements here.</div>'}
    </div>

    ${readinessRows.length ? `
    <div class="card">
      <h3>Material readiness &amp; process tracking <span class="hint">tracks linked Purchase Orders &amp; Process POs through to the Stock Pool</span></h3>
      ${readinessRows.map((r,ri)=>{
        const pipe = processPipelineForRow(r.row);
        const pipeKey = 'pt_'+ri;
        return `
        <div class="readiness-row">
          <div class="readiness-row-head" style="cursor:pointer;" onclick="toggleProcessTracking('${pipeKey}')">
            <b>${fabricName(r.row.fabricId)} (${r.row.width})</b> — ${colorName(r.row.colorId)}
            <span>${r.piecesReady >= r.row.pcs ? `<span class="pill pill-ok">✓ Ready for all ${r.row.pcs} pcs</span>` : (r.piecesReady>0 ? `<span class="pill pill-progress">Ready for ${r.piecesReady} of ${r.row.pcs} pcs</span>` : `<span class="pill pill-draft">Not yet ready</span>`)} <span class="btn-link" id="${pipeKey}_toggle">▸ Details</span></span>
          </div>
          <div class="readiness-bar-track"><div class="readiness-bar-fill" style="width:${Math.min(100,(r.readyQty/r.orderQty*100)||0)}%;"></div></div>
          <div class="hint" style="margin-top:4px;">Required ${r.orderQty.toFixed(1)}m · Ordered ${r.orderedQty.toFixed(1)}m · Received &amp; QC'd ${r.readyQty.toFixed(1)}m</div>
          <div id="${pipeKey}" style="display:none; margin-top:10px; padding:12px 14px; background:#FCFAF7; border:1px solid var(--line); border-radius:6px; font-size:12.5px;">
            ${pipe.matchingProcurePOs.length ? `<div style="margin-bottom:6px;"><b>Fabric Purchase Orders:</b> ${pipe.matchingProcurePOs.map(po=>`PO-${po.id} ${pillFor(po.status)}`).join(', ')}</div>` : ''}
            ${pipe.matchingProcessPOs.length ? `<div style="margin-bottom:6px;"><b>Process POs (${pipe.matchingProcessPOs[0]?.processType||'Dyeing'}):</b> ${pipe.matchingProcessPOs.map(po=>`PO-${po.poNo} ${pillFor(po.status)}`).join(', ')}</div>` : ''}
            ${pipe.relatedChallans.length ? `<div style="margin-bottom:6px;"><b>Job Challans:</b> ${pipe.relatedChallans.map(c=>`Challan-${c.challanNo} ${pillFor(c.status)}`).join(', ')}</div>` : ''}
            ${pipe.allGrns.length ? `<div style="margin-bottom:6px;"><b>GRNs (${pipe.allGrns.length}):</b> ${pipe.allGrns.map(g=>`GRN-${g.id} ${pillFor(grnStatus(g))}`).join(', ')}</div>` : ''}
            ${pipe.allQC.length ? `<div><b>Quality Checks (${pipe.allQC.length}):</b> ${pipe.allQC.map(q=>pillFor(q.status)).join(', ')}</div>` : ''}
            ${!pipe.matchingProcurePOs.length && !pipe.matchingProcessPOs.length ? `<div class="hint">Nothing ordered against this fabric/colour yet.</div>` : ''}
          </div>
        </div>
      `;}).join('')}
    </div>` : ''}

    <div class="card">
      <h3>Accessories planning <span class="hint">pick a category, then choose which accessory to add</span></h3>
      <div class="article-grid">
        ${categoriesWithCounts.map(c=>`
          <div class="article-tile ${selectedAccessoryCategory===c.cat?'selected':''}" onclick="selectedAccessoryCategory=(selectedAccessoryCategory==='${c.cat}'?null:'${c.cat}'); paintOrderForm();">
            <div style="font-size:22px; line-height:1; margin-bottom:4px;">${ACCESSORY_EMOJI[c.cat]||'🔘'}</div>
            <div class="article-tile-name">${c.cat} <span class="hint">(${c.count})</span></div>
          </div>`).join('') || '<div class="empty">No accessories set up yet — add some in Order Masters → Accessories.</div>'}
      </div>
      ${selectedAccessoryCategory ? `
      <div class="hint" style="margin:16px 0 8px;">${ACCESSORY_EMOJI[selectedAccessoryCategory]} ${selectedAccessoryCategory} — click one to add and configure it:</div>
      <div class="article-grid">
        ${accessoriesInSelectedCategory.map(a=>`
          <div class="article-tile" onclick="orderAddAccessory(${a.id})">
            <div style="font-size:20px; line-height:1; margin-bottom:4px;">${ACCESSORY_EMOJI[a.category]||'🔘'}</div>
            <div class="article-tile-name">${a.name}</div>
          </div>`).join('') || '<div class="empty">No accessories in this category yet.</div>'}
      </div>` : ''}
      ${accessoryConfigCards || '<div class="empty" style="margin-top:14px;">No accessories configured yet — pick a category above to add one.</div>'}
    </div>` : `
    <div class="card">
      <h3>Fabric colour &amp; consumption</h3>
      <div class="empty" style="padding:20px;">Save this order first — the consumption calculation and accessories are configured afterwards, via Edit. Fabric planning itself (above) is already saved with the rest of the order.</div>
    </div>`}

    <div class="btn-row">
      <button class="btn" onclick="orderSave('Draft')">Save as Draft</button>
      <button class="btn btn-primary" onclick="orderSave('Saved')">Save Order</button>
      <button class="btn btn-red" onclick="go('order-list')">Cancel</button>
    </div>
    ${isEdit ? `<div class="card"><h3>History</h3>${auditLogHTML(orderDraft.auditLog)}</div>` : ''}
  `;
}
window.orderToggleArticle = function(articleTypeId){
  const idx = orderDraft.articles.findIndex(a=>a.articleTypeId===articleTypeId);
  if(idx>-1){ orderDraft.articles.splice(idx,1); }
  else {
    const at = db.articleTypes.find(a=>a.id===articleTypeId);
    orderDraft.articles.push({ id: nextId(), articleTypeId, name: at?at.name:'Article', fabrics:[{role:'Main', fabricId: db.fabrics[0]?.id, avgLength:'', source:'Greige Fabric'}] });
  }
  paintOrderForm();
};
window.orderRemoveArticle = function(ai){ orderDraft.articles.splice(ai,1); paintOrderForm(); };
window.orderArticleField = function(ai, field, value){ orderDraft.articles[ai][field]=value; paintOrderForm(); };
window.orderAddFabricRow = function(ai){ orderDraft.articles[ai].fabrics.push({role:'', fabricId: db.fabrics[0]?.id, avgLength:'', source:'Greige Fabric'}); paintOrderForm(); };
window.orderRemoveFabricRow = function(ai,fi){ orderDraft.articles[ai].fabrics.splice(fi,1); paintOrderForm(); };
window.orderArticleFabricField = function(ai,fi,field,value){ orderDraft.articles[ai].fabrics[fi][field]=value; paintOrderForm(); };

window.orderAddCustomer = function(){
  orderDraft.customers.push({ id: nextId(), customerId: db.customers[0]?.id, articleIds:[], colorIds:[], sizeEntries:[] });
  paintOrderForm();
};
window.orderRemoveCustomer = function(ci){ orderDraft.customers.splice(ci,1); paintOrderForm(); };
window.orderCustField = function(ci,field,value){ orderDraft.customers[ci][field]=value; paintOrderForm(); };
window.orderCustToggleArticle = function(ci, articleId){
  const cust = orderDraft.customers[ci];
  const idx = cust.articleIds.indexOf(articleId);
  if(idx>-1) cust.articleIds.splice(idx,1); else cust.articleIds.push(articleId);
  paintOrderForm();
};
window.orderCustToggleColor = function(ci, colorId){
  const cust = orderDraft.customers[ci];
  const idx = cust.colorIds.indexOf(colorId);
  if(idx>-1) cust.colorIds.splice(idx,1); else cust.colorIds.push(colorId);
  paintOrderForm();
};
window.orderAddSeriesEntry = function(ci, articleId, colorId, seriesId){
  const cust = orderDraft.customers[ci];
  let se = cust.sizeEntries.find(x=>x.articleId===articleId && x.colorId===colorId);
  if(!se){ se = {articleId, colorId, seriesEntries:[]}; cust.sizeEntries.push(se); }
  se.seriesEntries.push({ seriesId, qty:{}, selectedSizeIds:[], uniform:null });
  paintOrderForm();
};
window.orderRemoveSeriesEntry = function(ci, articleId, colorId, seni){
  const cust = orderDraft.customers[ci];
  const se = cust.sizeEntries.find(x=>x.articleId===articleId && x.colorId===colorId);
  se.seriesEntries.splice(seni,1);
  paintOrderForm();
};

window.copySizesToColors = function(ci, articleId, sourceColorId){
  const cust = orderDraft.customers[ci];
  const sourceSe = cust.sizeEntries.find(x=>x.articleId===articleId && x.colorId===sourceColorId);
  if(!sourceSe){ closeModal(); return; }
  const checked = Array.from(document.querySelectorAll('#copySizesTargets input[type=checkbox]:checked')).map(el=>Number(el.dataset.targetColor));

  checked.forEach(targetColorId=>{
    cust.sizeEntries = cust.sizeEntries.filter(x=>!(x.articleId===articleId && x.colorId===targetColorId));
    cust.sizeEntries.push(JSON.parse(JSON.stringify({ ...sourceSe, colorId: targetColorId })));

  closeModal();
  toast('Sizes copied to '+checked.length+' colour(s) — each remains individually editable');

};

function computeRowOrderQty(row){
  const fabric = db.fabrics.find(f=>f.id===row.fabricId);
  const isGreige = row.source === 'Greige Fabric';
  const shrinkPct = isGreige ? (fabric?fabric.shrinkage:0) : 0;
  const maxBufferPct = fabric?(fabric.maxBuffer||0):0;
  const dyed = Number(row.dyedPerPiece||0);
  const greigePerPc = isGreige ? dyed * (1 + shrinkPct/100) : dyed;
  const totalGreige = greigePerPc * row.pcs;
  return { orderQty: totalGreige * (1 + maxBufferPct/100), shrinkPct };
}

function processPipelineForRow(row){
  if(!editingOrderId) return null;
  const linkedProcurePOs = db.pos.filter(p=>String(p.linkedOrderId)===String(editingOrderId));
  const linkedProcessPOs = db.processPOs.filter(p=>String(p.linkedOrderId)===String(editingOrderId));
  const isGreige = row.source === 'Greige Fabric';
  const matchingProcurePOs = linkedProcurePOs.filter(po=>po.items.some(it=>{
    const widthMatch = it.fabricId===row.fabricId && it.width===row.width;
    const colorMatch = isGreige || (it.colorId||null)===(row.colorId||null);
    return widthMatch && colorMatch;
  }));
  const matchingProcessPOs = linkedProcessPOs.filter(po=>po.lines.some(l=>l.fabricId===row.fabricId && l.width===row.width && l.colorId===row.colorId));
  const procureGrns = db.grns.filter(g=>(g.sourceType||'po')!=='challan' && matchingProcurePOs.some(po=>po.id===g.poId));
  const relatedChallans = db.jobChallans.filter(c=>c.poIds.some(pid=>matchingProcessPOs.some(po=>po.id===pid)));
  const processingGrns = db.grns.filter(g=>g.sourceType==='challan' && relatedChallans.some(c=>c.id===g.poId));
  const allGrns = [...procureGrns, ...processingGrns];
  const allQC = db.qcRecords.filter(q=>allGrns.some(g=>g.id===q.grnId));
  return { matchingProcurePOs, matchingProcessPOs, relatedChallans, allGrns, allQC };
}
function materialReadinessForOrder(){
  if(!editingOrderId) return [];
  const linkedProcurePOs = db.pos.filter(p=>String(p.linkedOrderId)===String(editingOrderId));
  const linkedProcessPOs = db.processPOs.filter(p=>String(p.linkedOrderId)===String(editingOrderId));
  return orderDraft.consumption.map(row=>{
    const { orderQty } = computeRowOrderQty(row);
    const isGreige = row.source === 'Greige Fabric';
    let orderedQty = 0;
    // Greige rows are procured colourless (the colour is applied later via processing),
    // so match the Procure PO on fabric+width only. Dyed/Stock rows are bought already
    // in the target colour, so match on colour too.
    linkedProcurePOs.forEach(po=>po.items.forEach(it=>{
      const widthMatch = it.fabricId===row.fabricId && it.width===row.width;
      const colorMatch = isGreige || (it.colorId||null)===(row.colorId||null);
      if(widthMatch && colorMatch) orderedQty += Number(it.qty||0);
    }));
    linkedProcessPOs.forEach(po=>po.lines.forEach(l=>{ if(l.fabricId===row.fabricId && l.width===row.width && l.colorId===row.colorId) orderedQty += Number(l.qty||0); }));

    // Ready = actually available in the Stock Pool, in the exact colour required for
    // cutting. Greige-sourced fabric only counts once it has come back dyed from
    // processing (i.e. carrying the right colour) — plain greige stock doesn't count
    // as "ready" yet, which is exactly the distinction that matters for cutting.
    const readyQty = stockAvailableFor(row.fabricId, row.width, row.colorId);
    const piecesReady = orderQty>0 ? Math.floor((readyQty/orderQty) * row.pcs) : 0;
    return { row, orderQty, orderedQty, readyQty, piecesReady, isGreige };
  }).filter(r=>r.orderQty>0);
}

function stockAvailable(fabricId, width){
  return db.stockPool.filter(s=>{
    const po = db.pos.find(p=>p.id===s.poId); if(!po) return false;
    const it = po.items[s.itemIdx];
    return it.fabricId===fabricId && it.width===width;
  }).reduce((sum,s)=>sum+s.qty,0);
}

  if(idx>-1) jobChallanDraft.poIds.splice(idx,1); else jobChallanDraft.poIds.push(poId);

window.jcLineMeters = function(key, value, remaining){

  let v = Number(value);

window.jcSave = function(status){
  if(!jobChallanDraft.poIds.length){ toast('Attach at least one Process PO'); return; }
  logEvent(jobChallanDraft.auditLog, editingJobChallanId?'Updated':'Created', 'Status: '+status, 'Job Challan', 'Challan-'+jobChallanDraft.challanNo);
  let c;
  const wasAlreadySent = editingJobChallanId && db.jobChallans.find(x=>x.id===editingJobChallanId)?._stockDeducted;
  if(editingJobChallanId){
    const idx = db.jobChallans.findIndex(x=>x.id===editingJobChallanId);
    c = { ...jobChallanDraft, id: editingJobChallanId, status };
    db.jobChallans[idx] = c;
  } else {
    c = { ...jobChallanDraft, id: nextId(), status };
    db.jobChallans.push(c);
    c.poIds.forEach(pid=>{ const po = db.processPOs.find(p=>p.id===pid); if(po && po.status!=='Completed') po.status = 'Challan Made'; });
  }
  // Dispatching physically removes this fabric from the Stock Pool — do this exactly
  // once per challan (never on a later edit/resave of the same dispatched challan).
  if(status==='Sent' && !wasAlreadySent){
    let shortfall = [];
    c.lines.forEach(l=>{
      const needed = Number(l.meters||0);
      if(needed<=0) return;
      // The fabric physically leaving is usually still un-dyed greige at this point —
      // the colour on the line is the *target* colour the vendor will dye it into.
      // Try an exact colour match first (covers re-sending already-dyed fabric for a
      // second process), then fall back to greige stock (the common case).
      let deducted = deductStock(l.fabricId, l.width, l.colorId, needed, 'Sent for processing on Challan-'+c.challanNo);
      if(deducted < needed - 0.001){
        deducted += deductStock(l.fabricId, l.width, null, needed - deducted, 'Sent for processing on Challan-'+c.challanNo);
      }
      if(deducted < needed) shortfall.push(`${fabricName(l.fabricId)} (${l.width}${l.colorId?', '+colorName(l.colorId):''}): short by ${(needed-deducted).toFixed(1)}m`);
    });
    c._stockDeducted = true;
    if(shortfall.length) toast('Dispatched — but Stock Pool had less than needed for: '+shortfall.join('; '));
  }
  toast('Job Challan-'+jobChallanDraft.challanNo+' saved as "'+status+'"'+(status==='Sent'&&!wasAlreadySent?' — fabric deducted from Stock Pool':''));
  go('job-challan-list');
};

/* ---- Reprocessing shortcut ----

   pre-filled with the same fabric/colour/quantity, so it can go out and come back
   through this exact same GRN + QC cycle again. */
window.reprocessRejectedItem = function(qcId){
  const q = db.qcRecords.find(x=>x.id===qcId);
  const challan = db.jobChallans.find(c=>c.id===q.poId);
  const line = challan.lines[q.itemIdx];
  const originalPO = db.processPOs.find(p=>p.poNo===line.poNo);
  window._prefillProcessPOFromOrder = {
    linkedOrderId: originalPO?originalPO.linkedOrderId:null,
    lines: [{ styleName: line.styleName, customerName: line.customerName||'', brandName: line.brandName||'', fabricId: line.fabricId, colorId: line.colorId, width: line.width, qty: q.receivedQty, rate:'', remarks:'Reprocessing — failed QC on GRN-'+q.grnId, deliveryDate:'' }],
  };

  go('process-po-form');
};

================================================================= */
let cuttingPODraft = null;
let editingCuttingPOId = null;
const CUTTING_CHECKLIST_ITEMS = [
  { key:'sampleSeen', label:'Sample has been seen (सैम्पल देख लिया है)' },
  { key:'commentSizeChecked', label:'Comments, size & length on the sample checked (सैम्पल पर कमेंट, साइज़ व लम्बाई चैक करे)' },
  { key:'orderSheetChecked', label:'Order sheet checked (ऑर्डर शीट चैक करे)' },
  { key:'patternChecked', label:'Pattern checked against the sample — if different, confirmed with Sir before cutting (पैटर्न सैम्पल के हिसाब से चैक करे, अलग होने पर सर के पास करवाकर ही कन्फर्म करे)' },
  { key:'layerMarkingChecked', label:'Layer marking checked, pattern is clean (लेयर मार्किंग चैक करे, पैटर्न है साफ)' },
  { key:'finalRecheck', label:'Garment length, quantity & size re-checked (गारमेन्ट की लम्बाई, क्वान्टिटी व साइज़ दुबारा चैक करे)' },
];
function nextCuttingPONo(){ return 9001 + db.cuttingPOs.length; }
function alreadyCutForSize(linkedOrderId, articleId, colorId, sizeId, excludeCuttingPOId){
  let sum = 0;
  db.cuttingPOs.forEach(cp=>{
    if(cp.id===excludeCuttingPOId) return;
    if(cp.linkedOrderId!==linkedOrderId || cp.articleId!==articleId || cp.colorId!==colorId) return;
    const sz = cp.sizes.find(s=>s.sizeId===sizeId);
    if(sz) sum += Number(sz.cuttingQty||0);
  });
  return sum;
}
function cuttingPOStatus(cp){
  if(cp.status==='Completed') return 'Completed';
  if(cp.layers && cp.layers.length) return 'In Progress';
  const allChecked = CUTTING_CHECKLIST_ITEMS.every(c=>cp.checklist[c.key]);
  return allChecked ? 'Ready to Cut' : 'Draft';
}
function computeCuttingReport(cp){
  const totalGarmentsPerLayer = cp.layers.map(l=>({ layer:l, garments: (l.pallaQty||0) * (l.sizeIds||[]).length, mts: (l.layerLength||0)*(l.pallaQty||0) }));
  const totalMtsUsedInLayers = totalGarmentsPerLayer.reduce((s,x)=>s+x.mts,0);
  const totalGarmentsCut = totalGarmentsPerLayer.reduce((s,x)=>s+x.garments,0);
  const avgFabricPerGarment = totalGarmentsCut>0 ? totalMtsUsedInLayers/totalGarmentsCut : 0;
  const fabricBalanceFromLayer = Number(cp.totalFabricAvailable||0) - totalMtsUsedInLayers;
  const totalTrimPerPc = (cp.trims||[]).reduce((s,t)=>s+Number(t.perPc||0),0);
  const totalTrimFabricUsed = totalTrimPerPc * totalGarmentsCut;
  const grandTotalFabricUsed = totalMtsUsedInLayers + totalTrimFabricUsed;
  const fabricCountedAvailable = Number(cp.fabricCountedAvailable||0);
  const finalFabricRemaining = fabricBalanceFromLayer - totalTrimFabricUsed;
  const totalFabricAvail = Number(cp.totalFabricAvailable||0);
  const wastagePct = totalFabricAvail>0 ? ((totalFabricAvail - grandTotalFabricUsed - fabricCountedAvailable) / totalFabricAvail * 100) : 0;
  // per-size cut tally
  const sizesCutTally = {};
  cp.layers.forEach(l=>{ (l.sizeIds||[]).forEach(sid=>{ sizesCutTally[sid] = (sizesCutTally[sid]||0) + Number(l.pallaQty||0); }); });
  return { totalGarmentsPerLayer, totalMtsUsedInLayers, totalGarmentsCut, avgFabricPerGarment, fabricBalanceFromLayer, totalTrimFabricUsed, grandTotalFabricUsed, finalFabricRemaining, wastagePct, sizesCutTally };
}

    </div>

      <table>
        <thead><tr><th>Cutting PO</th><th>Order</th><th>Article</th><th>Colour</th><th>Cutting / Ordered qty</th><th>Status</th><th></th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="empty">No Cutting POs yet — once dyed fabric passes QC, create one to send it to the Cutting Master.</td></tr>'}</tbody>

window.openCuttingPOPickerModal = function(){
  // list article+colour combinations across all sales orders that have consumption rows with stock available
  const options = [];
  db.salesOrders.forEach(order=>{
    (order.consumption||[]).forEach(row=>{
      const avail = stockAvailableFor(row.fabricId, row.width, row.colorId);
      if(avail<=0) return;
      const article = order.articles.find(a=>a.id===row.articleId);
      options.push({ orderId: order.id, styleName: order.styleName, articleId: row.articleId, articleName: article?article.name:'—', colorId: row.colorId, fabricId: row.fabricId, width: row.width, avail });
    });
  });
  const rows = options.map(o=>`
    <tr>
      <td>${o.styleName}</td>
      <td>${o.articleName}</td>
      <td><span class="legend-dot" style="background:${db.colors.find(c=>c.id===o.colorId)?.hex||'#ccc'};"></span> ${colorName(o.colorId)}</td>
      <td>${fabricName(o.fabricId)} (${o.width})</td>
      <td class="amt">${o.avail.toFixed(1)}m</td>
      <td><button class="btn btn-small btn-gold" onclick="closeModal(); go('cutting-po-form', '${o.orderId}:${o.articleId}:${o.colorId}');">Select</button></td>
    </tr>`).join('');
  openModal(`
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h3>Which article &amp; colour is this cutting PO for?</h3>
    <div class="modal-sub">Only combinations with fabric currently available in the Stock Pool are shown.</div>
    <table>
      <thead><tr><th>Order</th><th>Article</th><th>Colour</th><th>Fabric</th><th>Available</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">Nothing available yet — get fabric through QC first.</td></tr>'}</tbody>
    </table>
  `, true);
};
function renderCuttingPOForm(arg){
  const existing = typeof arg === 'number' ? db.cuttingPOs.find(c=>c.id===arg) : null;
  if(existing){
    editingCuttingPOId = existing.id;
    cuttingPODraft = JSON.parse(JSON.stringify(existing));
    paintCuttingPOForm();
    return;
  }
  const [orderIdStr, articleIdStr, colorIdStr] = String(arg).split(':');
  const orderId = Number(orderIdStr), articleId = Number(articleIdStr), colorId = Number(colorIdStr);
  const order = db.salesOrders.find(o=>o.id===orderId);
  if(!order){ toast('Pick an article & colour first'); go('cutting-po-list'); return; }
  const article = order.articles.find(a=>a.id===articleId);
  const consumptionRow = order.consumption.find(r=>r.articleId===articleId && r.colorId===colorId);
  const avail = stockAvailableFor(consumptionRow.fabricId, consumptionRow.width, colorId);
  // find a QC record whose stock ended up matching this fabric/width/colour, to pull notes/photos/width-found across
  const relatedStock = db.stockPool.filter(s=>s.fabricId===consumptionRow.fabricId && s.width===consumptionRow.width && (s.colorId||null)===(colorId||null) && s.qcId);
  const qc = relatedStock.length ? db.qcRecords.find(q=>q.id===relatedStock[relatedStock.length-1].qcId) : null;
  // sizes & ordered qty for this article+colour across all customers on the order
  const sizeTotals = {};
  order.customers.forEach(cust=>{
    if(!(cust.articleIds||[]).includes(articleId)) return;
    (cust.sizeEntries||[]).filter(se=>se.articleId===articleId && se.colorId===colorId).forEach(se=>{
      (se.seriesEntries||[]).forEach(sen=>{
        Object.entries(sen.qty||{}).forEach(([sizeId,qty])=>{
          sizeTotals[sizeId] = (sizeTotals[sizeId]||0) + Number(qty||0);
        });
      });
    });
  });
  const sizes = Object.entries(sizeTotals).map(([sizeId,qty])=>{
    const sizeIdNum = Number(sizeId);
    let display = sizeId;
    db.sizeSeries.forEach(s=>{ const sz=s.sizes.find(x=>x.id===sizeIdNum); if(sz) display=sz.display; });
    return { sizeId: sizeIdNum, display, orderedQty: qty, cuttingQty: '' };
  });
  editingCuttingPOId = null;
  cuttingPODraft = {
    linkedOrderId: orderId, articleId, colorId, styleName: order.styleName,
    sizes, totalFabricAvailable: avail, fabricWidth: qc?(qc.widthFound||consumptionRow.width):consumptionRow.width,
    avgConsumptionPlanned: consumptionRow.dyedPerPiece||'',
    qcNote: qc?qc.notes:'', qcPhotos: qc?(qc.photoDataUrls||[]):[],
    checklist: {}, markingMasterName:'', checkingMasterName:'', cuttingMasterName:'', layerManName:'',
    meteringPieces: [], layers: [], trims: [], fabricCountedAvailable:'', status:'Draft', auditLog:[],
  };
  logEvent(cuttingPODraft.auditLog, 'Cutting PO started', article?.name+' / '+colorName(colorId));
  paintCuttingPOForm();
}

    const already = alreadyCutForSize(cp.linkedOrderId, cp.articleId, cp.colorId, sz.sizeId, editingCuttingPOId);

  const layersHTML = cp.layers.map((l,li)=>{

        <div class="field small"><label>Cutting date</label><input type="date" value="${l.cuttingDate}" onchange="cutLayerField(${li},'cuttingDate',this.value)"></div>

      <div class="chip-row">${cp.sizes.map(sz=>`<button type="button" class="chip ${(l.sizeIds||[]).includes(sz.sizeId)?'chip-on':''}" onclick="cutToggleLayerSize(${li},${sz.sizeId})">${sz.display}${(l.sizeIds||[]).includes(sz.sizeId)?' ✓':''}</button>`).join('')}</div>
      <div class="compare" style="margin-top:8px;">This layer: <b>${mts.toFixed(2)}m</b> used → <b>${garments}</b> garments (${l.pallaQty||0} pcs × ${(l.sizeIds||[]).length} size(s))</div>
    </div>`;
  }).join('');

  const trimsHTML = cp.trims.map((t,ti)=>`
    <div class="row" style="align-items:flex-end;">
      <div class="field"><label>Purpose</label><input type="text" value="${t.label}" placeholder="e.g. Sleeve couching" onchange="cutTrimField(${ti},'label',this.value)"></div>
      <div class="field small"><label>Fabric per piece (m)</label><input type="number" value="${t.perPc}" onchange="cutTrimField(${ti},'perPc',this.value)"></div>
      <div class="field small"><button class="btn-link" onclick="cutRemoveTrim(${ti})">Remove</button></div>
    </div>`).join('');

  const overConsumed = report.grandTotalFabricUsed > Number(cp.totalFabricAvailable||0) + 0.01;
  const wastageFlag = report.wastagePct > 3 || overConsumed;

  main.innerHTML = `
    <div class="pagehead">
      <div class="crumb"><span class="back" onclick="go('cutting-po-list')">← back to Cutting POs</span></div>
      <h1>${editingCuttingPOId ? 'Cutting PO CUT-'+editingCuttingPOId : 'New Cutting PO'} ${pillFor(cuttingPOStatus(cp))}</h1>
      <p>${order.styleName} — ${article.name} — ${colorName(cp.colorId)}. Filled by the merchandiser and handed to the Cutting Master (in-house); the sections below that are filled or reported by the Cutting Master.</p>
    </div>

    <div class="card">
      <h3>Order details <span class="hint">auto-filled from the Sales Order</span></h3>
      <div class="detail-grid">
        <div><div class="dt">Design / style name</div><div class="dd">${order.styleName}</div></div>
        <div><div class="dt">Article</div><div class="dd">${article.name}</div></div>
        <div><div class="dt">Colour</div><div class="dd">${colorName(cp.colorId)}</div></div>
        <div><div class="dt">Total fabric available</div><div class="dd">${Number(cp.totalFabricAvailable).toFixed(1)}m</div></div>

        <div class="dt">Quality check notes (auto-attached)</div>

      </div>` : ''}
      <p class="hint" style="margin-top:14px;"><b>Do not start layer before:</b> 1. Approved sample in hand. 2. Fabric checked for colour fastness, width, and any defect.</p>

        <tbody>${sizesRows}</tbody>

      <div style="text-align:right; margin-top:10px;"><b>Total cutting order quantity: ${totalCuttingQty} pcs</b></div>

      <h3>Checklist for Cutting Master <span class="badge-req">must complete before layering</span></h3>
      ${checklistRows}
      <div class="row" style="margin-top:10px;">
        <div class="field"><label>Marking Master</label><input type="text" value="${cp.markingMasterName}" onchange="cp.markingMasterName=this.value"></div>
        <div class="field"><label>Checking Master</label><input type="text" value="${cp.checkingMasterName}" onchange="cp.checkingMasterName=this.value"></div>

    </div>

    <div class="card">

      <p class="hint" style="margin:0 0 10px;">Enter each physically measured piece; declared total is ${Number(cp.totalFabricAvailable).toFixed(1)}m.</p>
      ${tagInputHTML('cut_metering', cp.meteringPieces)}
      <div class="totals-bar ${meteringMatches?'match':'mismatch'}" style="margin-top:10px;">
        <span>Tallied total: <b>${meteringSum.toFixed(1)}m</b></span>

      </div>
      <button class="btn btn-small" style="margin-top:10px;" onclick="cutSaveMetering()">Save Tally</button>
    </div>

    <div class="card ${!allChecked?'disabled-card':''}">
      <h3>Layers ${allChecked?`<button class="btn btn-small btn-gold" onclick="cutAddLayer()">+ Add Layer</button>`:''}</h3>
      ${!allChecked ? '<div class="empty">Complete the checklist above before adding layers.</div>' : (layersHTML || '<div class="empty">No layers yet — click "+ Add Layer" to record the first one.</div>')}

    <div class="card">
      <h3>Trims <span class="hint">extra fabric used outside the main layer, e.g. couching</span></h3>

    </div>

      <h3>Layer &amp; wastage report <span class="hint">calculated automatically</span></h3>
      <div class="detail-grid">
        <div><div class="dt">Total fabric used in layers</div><div class="dd">${report.totalMtsUsedInLayers.toFixed(2)}m</div></div>

        <div><div class="dt">Average fabric used / garment</div><div class="dd">${report.avgFabricPerGarment.toFixed(2)}m ${cp.avgConsumptionPlanned && Math.abs(report.avgFabricPerGarment-cp.avgConsumptionPlanned)>0.15 ? '<span class="pill pill-reject" style="margin-left:6px;">⚠ differs from planned '+cp.avgConsumptionPlanned+'m</span>' : ''}</div></div>

    ${editingCuttingPOId ? `<div class="card"><h3>History</h3>${auditLogHTML(cp.auditLog)}</div>` : ''}
  `;
}
window.cutSizeQty = function(si, value, remaining){
  let v = Number(value);
  if(!isNaN(v) && v>remaining){ toast('Only '+remaining+' pcs remaining on this size'); v = remaining; }
  cuttingPODraft.sizes[si].cuttingQty = value===''?'':v;
  paintCuttingPOForm();
};
window.cutChecklistToggle = function(key, checked){ cuttingPODraft.checklist[key] = checked; paintCuttingPOForm(); };
window.cutSaveMetering = function(){
  cuttingPODraft.meteringPieces = (window['_tags_cut_metering']||[]).slice();
  toast('Metering tally saved');
  paintCuttingPOForm();
};
window.cutAddLayer = function(){
  cuttingPODraft.meteringPieces = (window['_tags_cut_metering']||cuttingPODraft.meteringPieces).slice();
  cuttingPODraft.layers.push({ id: nextId(), layerNo: cuttingPODraft.layers.length+1, cuttingDate: todayISO(), layerLength:'', sizeIds:[], pallaQty:'' });
  paintCuttingPOForm();
};
window.cutRemoveLayer = function(li){ cuttingPODraft.layers.splice(li,1); cuttingPODraft.layers.forEach((l,i)=>l.layerNo=i+1); paintCuttingPOForm(); };
window.cutLayerField = function(li, field, value){ cuttingPODraft.layers[li][field]=value; paintCuttingPOForm(); };
window.cutToggleLayerSize = function(li, sizeId){
  const l = cuttingPODraft.layers[li];
  l.sizeIds = l.sizeIds||[];
  const idx = l.sizeIds.indexOf(sizeId);
  if(idx>-1) l.sizeIds.splice(idx,1); else l.sizeIds.push(sizeId);
  paintCuttingPOForm();
};
window.cutAddTrim = function(){ cuttingPODraft.trims.push({label:'', perPc:''}); paintCuttingPOForm(); };
window.cutRemoveTrim = function(ti){ cuttingPODraft.trims.splice(ti,1); paintCuttingPOForm(); };
window.cutTrimField = function(ti, field, value){ cuttingPODraft.trims[ti][field]=value; paintCuttingPOForm(); };
window.cutSaveDraft = function(){
  cuttingPODraft.meteringPieces = (window['_tags_cut_metering']||cuttingPODraft.meteringPieces).slice();
  logEvent(cuttingPODraft.auditLog, editingCuttingPOId?'Progress saved':'Cutting PO created', '', 'Cutting PO', 'CUT-'+(editingCuttingPOId||'new'));
  if(editingCuttingPOId){
    const idx = db.cuttingPOs.findIndex(c=>c.id===editingCuttingPOId);
    db.cuttingPOs[idx] = { ...cuttingPODraft, id: editingCuttingPOId };
  } else {
    const cp = { ...cuttingPODraft, id: nextId() };
    db.cuttingPOs.push(cp);
    editingCuttingPOId = cp.id;
  }
  toast('Cutting PO saved');
  go('cutting-po-list');
};
window.cutMarkComplete = function(){
  const report = computeCuttingReport(cuttingPODraft);
  if(!cuttingPODraft.layers.length){ toast('Add at least one layer before marking complete'); return; }
  cuttingPODraft.status = 'Completed';
  cuttingPODraft.meteringPieces = (window['_tags_cut_metering']||cuttingPODraft.meteringPieces).slice();
  logEvent(cuttingPODraft.auditLog, 'Marked Completed', report.totalGarmentsCut+' garments cut, '+report.wastagePct.toFixed(2)+'% wastage', 'Cutting PO', 'CUT-'+(editingCuttingPOId||'new'));
  let cp;
  if(editingCuttingPOId){
    const idx = db.cuttingPOs.findIndex(c=>c.id===editingCuttingPOId);
    cp = { ...cuttingPODraft, id: editingCuttingPOId };
    db.cuttingPOs[idx] = cp;
  } else {
    cp = { ...cuttingPODraft, id: nextId() };
    db.cuttingPOs.push(cp);
    editingCuttingPOId = cp.id;
  }
  // deduct the fabric actually used (layers + trims) from the Stock Pool
  const order = db.salesOrders.find(o=>o.id===cp.linkedOrderId);
  const consumptionRow = order.consumption.find(r=>r.articleId===cp.articleId && r.colorId===cp.colorId);
  deductStock(consumptionRow.fabricId, consumptionRow.width, cp.colorId, report.grandTotalFabricUsed, 'Used for Cutting PO CUT-'+cp.id);
  toast('Cutting PO completed — '+report.totalGarmentsCut+' pieces cut and ready for stitching');
  go('cutting-po-list');
};
window.printCuttingPO = function(cpId){
  const cp = cpId ? db.cuttingPOs.find(c=>c.id===cpId) : cuttingPODraft;
  const order = db.salesOrders.find(o=>o.id===cp.linkedOrderId);
  const article = order.articles.find(a=>a.id===cp.articleId);
  const report = computeCuttingReport(cp);
  const rows = cp.sizes.map(sz=>`<tr><td>${sz.display}</td><td>${sz.orderedQty}</td><td>${sz.cuttingQty||0}</td></tr>`).join('');
  const body = `
    <div class="doc-head">
      <div class="company">Rain Drop
        <div class="tag">PO for Cutting Master Ji (In-house)</div>
      </div>
      <div class="doctitle"><h1>CUTTING PO</h1><div class="meta">CUT-${cp.id||'new'}<br>Design: ${order.styleName}<br>Article: ${article.name} · Colour: ${colorName(cp.colorId)}</div></div>
    </div>
    <table>
      <thead><tr><th>Size</th><th>Order Qty</th><th>Cutting Qty</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="terms">
      <b>Do not start layer before:</b> 1. Approved sample in hand. 2. Fabric checked for colour fastness, width and any defect.<br>
      <b>Total fabric available:</b> ${Number(cp.totalFabricAvailable).toFixed(1)}m &nbsp; <b>Fabric width (after processing):</b> ${cp.fabricWidth||'—'}<br>
      ${cp.qcNote?('<b>QC notes:</b> '+cp.qcNote+'<br>'):''}
      <b>Total garments cut:</b> ${report.totalGarmentsCut} &nbsp; <b>Total layer wastage:</b> ${report.wastagePct.toFixed(2)}%
    </div>
    <div class="sign-row">
      <div class="sign"><div class="line">${cp.cuttingMasterName||''}<br>Cutting Master</div></div>
      <div class="sign"><div class="line">${cp.checkingMasterName||''}<br>Checking Master</div></div>
    </div>
  `;
  openPrintWindow('Cutting PO CUT-'+(cp.id||'new'), body);
};

/* init */
go('dashboard');

  // Requirement 45: Disable mouse wheel and Arrow Up/Down on all number inputs
  window.addEventListener('wheel', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'number') {
      e.target.blur();
    }
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'number') {
      document.activeElement.blur();
    }
  }, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'number') {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
      }
    }
  });
</script>
